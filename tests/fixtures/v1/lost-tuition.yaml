id: lost-tuition
title: 一笔消失的学费
intro: >-
  开学前，大一新生小林想靠网上兼职补贴生活费，却在一个刷单群里转出了两万元学费。
  群聊随后被解散，客服也失去联系。作为学校反诈社团的调查员，你需要问询小林、室友阿凯和隔壁宿舍的周同学，
  找出钱的去向和骗局的来龙去脉。
facts:
  - id: f1
    text: 小林加入刷单群后，先完成小额任务并收到返利，后来被要求垫资完成连单。
  - id: f2
    text: 客服以连单未完成、账户冻结为由催促小林继续转账，小林最终转出两万元学费。
  - id: f3
    text: 阿凯把刷单群的邀请链接发给了小林，自己也曾在群里拿到小额返利。
  - id: f4
    text: 小林转账回单上的收款账户户名是周明，正是隔壁宿舍的周同学。
  - id: f5
    text: 周明曾把银行卡和相关信息卖给收卡的人，收款账户随后被用于接收小林的转账。
  - id: f6
    text: 阿凯发邀请时认为群里的兼职能赚钱，没有预见小林会损失两万元。
characters:
  - id: xiaolin
    name: 小林
    avatar: xiaolin.png
    profile: 大一新生，在网上兼职时被骗走两万元学费。
    persona: >-
      着急又自责，担心被责怪，起初不愿主动提自己拿过返利，也不好意思说出推荐人。
      玩家询问兼职过程或转账时，愿意提供群聊记录和转账回单；看到阿凯发来的邀请截图后，会找阿凯对质。
      只知道自己的经历和自己持有的材料，不知道周明卖卡的经过。
    knows: [f1, f2, f3, f4]
    secrets:
      - fact: f3
        until: {shown: c5}
    trust_start: 0
  - id: akai
    name: 阿凯
    avatar: akai.png
    profile: 小林的室友，曾接触过同一个兼职群。
    persona: >-
      外向、嘴硬，起初觉得自己只是分享兼职，不愿承认自己拿过返利。
      玩家问到群从哪来时，可以聊自己接触兼职群的经过；取得一点信任后愿意交出自己和小林的邀请截图。
      被小林质问时承认发过链接，并拿出返利记录。发链接时不知道小林后来转了两万元。
    knows: [f3, f6]
    secrets:
      - fact: f3
        until: {trust: 1}
    trust_start: 0
  - id: zhou
    name: 周同学
    avatar: zhou.png
    profile: 隔壁宿舍的学生，平时和小林、阿凯有来往。
    persona: >-
      紧张、话少，担心卖卡的事被发现，起初否认与这笔钱有关。
      看到小林的转账回单后承认卖过银行卡，并愿意交出卖卡聊天记录和收款凭据。
      他知道自己卖卡的经过，但不知道是谁组织刷单群，也不知道阿凯和小林的聊天内容。
    knows: [f4, f5]
    secrets:
      - fact: f5
        until: {shown: c2}
    trust_start: 0
clues:
  - id: c1
    title: 刷单群聊天记录
    content: >-
      小林保存的群聊显示，客服先安排小额购物任务并发放返利，随后要求垫资做连单；
      小林提出提现时，客服称任务未完成、账户已冻结，要求继续转账才能解冻。
    holder: xiaolin
  - id: c2
    title: 两万元转账回单
    content: >-
      小林的银行回单显示，他向户名为周明的账户转账两万元；
      周明是隔壁宿舍的周同学。回单证明收款账户的户名，不显示账户此后由谁操作。
    holder: xiaolin
  - id: c3
    title: 小额返利记录
    content: >-
      小林的支付记录显示，第一次垫付一百元后收到一百一十元；
      群客服随即推荐金额更高的连单任务。
    holder: xiaolin
  - id: c4
    title: 卖卡聊天记录
    content: >-
      周明与一名收卡人的聊天记录显示，对方提出购买银行卡及相关信息，
      周明答应交出自己的卡。聊天没有显示收卡人的真实身份。
    holder: zhou
    requires: {shown: c2}
  - id: c5
    title: 兼职群邀请截图
    content: >-
      阿凯与小林的聊天截图显示，阿凯发来兼职群邀请链接，
      还说自己试过一单拿到了返利。小林随后回复“我去看看”。
    holder: akai
    requires: {trust: 1}
  - id: c6
    title: 阿凯的返利记录
    content: >-
      对质后阿凯交出的支付记录显示，他曾收到群里一笔小额返利；
      他承认因此相信兼职是真的，才把群链接发给小林。
    holder: xiaolin
    requires: {shown: c5}
  - id: c7
    title: 卖卡收款凭据
    content: >-
      周明出示的收款记录显示，他在小林转账之前收到收卡人支付的一笔卖卡款。
      这与他交出的卖卡聊天记录相互印证。
    holder: zhou
    requires: {shown: c2}
events:
  - id: e1
    when: {shown: c5, to: xiaolin}
    confront: [xiaolin, akai]
    unlock: [c6]
hints:
  - text: 先问小林兼职的过程和付款情况，他保存了群聊与转账材料。
  - text: 看看转账回单上的户名，再把回单出示给周同学。
  - text: 阿凯接触过兼职群，多聊几句，问问他有没有和小林的聊天记录。
  - text: 把阿凯的邀请截图出示给小林，听听他们怎么解释。
ending:
  questions:
    - id: q1
      text: 小林遇到的是哪种诈骗？
      options: [刷单返利诈骗, 冒充客服退款诈骗, 网络贷款诈骗]
      answer: 刷单返利诈骗
    - id: q2
      text: 小林的钱转入了谁名下的账户？
      options: [周明, 阿凯, 小林]
      answer: 周明
    - id: q3
      text: 是谁把兼职群邀请链接发给了小林？
      options: [阿凯, 周明, 学校老师]
      answer: 阿凯
    - id: q4
      text: 哪条证据最直接地揭示了骗局如何诱导小林继续转账？
      options: [刷单群聊天记录, 卖卡收款凭据, 兼职群邀请截图]
      answer: 刷单群聊天记录
  truth: >-
    阿凯在兼职群里拿到小额返利，以为兼职可靠，便把邀请链接发给了室友小林。
    小林也先收到小额返利，随后被客服诱导垫资做连单；客服又以任务未完成、账户冻结为由催他继续转账。
    小林最终转出了两万元学费。回单显示，钱进入周明名下的账户；周明此前已将银行卡和相关信息卖给收卡人。
    对质后，阿凯承认自己发过链接并拿出返利记录。现有证据没有查明刷单群组织者或收卡人的真实身份。
  lessons:
    - 刷单返利中先给小额返利、再要求垫资连单和付费解冻是典型骗局；不要为了提现继续转账。
    - 不要出租、出借或出售银行卡及账户信息；账户被用于违法犯罪，可能承担相应法律责任。
    - 发现被骗后立即停止转账，保存聊天记录和转账凭证，及时拨打 110 报警并联系银行寻求止付。
