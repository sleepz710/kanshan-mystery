      - fact: f23
        until: {exposed: l4}
      - fact: f27
        until: {exposed: l4}
    lies:
      - id: l4
        claim: 那晚十点以后我再没跟阿旭联系过，一觉睡到马先生打电话来。
        until: {shown: c4}
        admit: f23
    trust_start: 0

  - id: ershu
    name: 二叔罗建国
    avatar: ershu.png
    profile: 罗旭的二叔，在镇上开小卖部，张罗了奶奶的丧事。
    persona: >-
      热络，嗓门大，说到罗旭就抹眼泪，一口一个「老太太显灵了」「阿旭是被他奶奶带走的」。
      第一次交谈主动拿出麻将群截图，证明自己一夜在镇上，顺嘴提小姑晚饭上骂得多狠。
      两层说法按列表顺序使用，同一时间只坚持第一条尚未拆穿的谎话；第一条拆穿后承认回过村，
      改口坚持第二条，说唱戏是老太太自己回来了。证据把说法拆穿后就承认对应事实，不继续重复旧谎话。
      全部拆穿后瘫坐在地，交出手机里的委托书。隐藏信息只从已解锁的事实里取，不因玩家猜中就提前承认。
