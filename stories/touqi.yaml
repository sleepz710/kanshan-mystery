    content: >-
      23:47，小姑刚出院门，戏匣子唱起《天仙配》，唱到第三句卡了一下，又从头唱。
      小姑说：「那盘磁带是我小时候摔的，第三句一直卡。妈自己唱，从来不卡。」
    holder: xiaogu
    requires: {event: e1}

events:
  - id: e1
    when: {shown: c7, to: xuman}
    confront: [xuman, xiaogu]
    unlock: [c13]

kanshan:
  greeting: >-
    搭档，我是刘看山。这一夜发生了什么，我都知道。老规矩：你问是或不是，我只答是、不是、不重要，一共 5 次。
    鬼我是不信的。先去听听许蔓怎么说吧。
  hints:
    - done: {has: c7}
      vague: 说自己一夜都在镇上的人，朋友圈的定位可不一定这么写。
      direct: 多和许蔓聊聊，拿到小姑删掉的朋友圈，出示给小姑。
    - done: {exposed: l1}
      vague: 麻将群里有两个多小时，谁也找不到二叔。那时候后墙外停着谁的车？
      direct: 把小姑的原视频出示给二叔。
    - done: {exposed: l2}
      vague: 罗旭手里那罐喷雾是哪家药房的？那天谁去过县城？
      direct: 和许蔓聊聊丧事的开销，拿到报销票据，出示给二叔。
    - done: {exposed: l5}
      vague: 规矩是谁定的？奶奶自己有没有留过话？
      direct: 把奶奶的字条出示给马先生。
    - done: {exposed: l4}
      vague: 罗旭最后一个电话，打给了谁？
      direct: 把马先生给的通话记录出示给许蔓。
    - done: {has: c11}
      vague: 二叔图的是什么？罗旭回村这几天，看到过什么？
      direct: 多和许蔓聊聊，问罗旭回村以后在忙什么。

ending:
  questions:
    - id: q1
      text: 罗旭是怎么死的？
      options:
        - 被奶奶的亡魂带走了
        - 哮喘发作，喷雾被换成了空罐
        - 被人闷死在灵堂里
      answer: 哮喘发作，喷雾被换成了空罐
    - id: q2
      text: 半夜老宅里的戏声是什么？
      options:
        - 奶奶的戏匣子自己响了
        - 小姑在院子里唱的
        - 二叔用藏在戏匣子里的蓝牙音箱放的录音
      answer: 二叔用藏在戏匣子里的蓝牙音箱放的录音
    - id: q3
      text: 灵堂门为什么从里面闩着？
      options:
        - 凶手用细线从门外闩上
        - 罗旭听见戏声害怕，自己闩上的
        - 有人躲在灵堂里，天亮前才走
      answer: 罗旭听见戏声害怕，自己闩上的
    - id: q4
      text: 这一夜是谁安排的？
      options:
        - 小姑罗秀
        - 马先生
        - 二叔罗建国
      answer: 二叔罗建国
    - id: q5
      text: 二叔为什么要害罗旭？
      options:
        - 想把老宅改到自己名下
        - 怕罗旭查出他伪造委托书、领走拆迁款
        - 记恨罗旭不孝
      answer: 怕罗旭查出他伪造委托书、领走拆迁款
  endings:
    - id: truth
      title: 真相大白
      when: {correct: [q2, q4, q5]}
      text: >-
        二叔是在奶奶坟前被带走的，手机里还存着那段《天仙配》。马先生把两千块退了回去，从此不再接白事。
        小姑把金镯子和奶奶的字条一起放回了灵前。许蔓把那通电话从头到尾讲给警察听。讲完，她抱着奶奶的戏匣子回了省城，
        后盖上那两颗新螺丝，她一颗一颗拧了下来。
    - id: haunted
      title: 头七回魂
      when: {chose: {q1: 被奶奶的亡魂带走了}}
      text: >-
        你在报告上写下：死因不明。村里从此多了一个故事，罗家老太太头七回魂，带走了长孙。罗旭火化得很快，
        二叔跑前跑后，签了所有的字。过了年，老宅推平了，二叔给奶奶修了村里最气派的一座坟。每年清明，
        他都在坟前用手机放那段《天仙配》，唱到第三句，卡一下，再从头唱。刘看山看完报告，只说了一句：「鬼不会去药房买喷雾。」
      retry: true
    - id: wronged
      title: 冤枉好人
      when: {chose: {q4: 小姑罗秀}}
      text: >-
        你把小姑的名字写进了报告：那晚她偷偷回过老宅，骂过「遭报应」，还拿走了金镯子。她在派出所待了三天，
        村里人见了她就绕着走。二叔张罗了罗旭的后事，在火化单上第一个签了字。
      retry: true
    - id: half
      title: 只查到一半
      text: >-
        你查出戏声不是鬼，喷雾也被人换过，却说不清是谁、为了什么。罗旭火化那天，二叔哭得最凶。
        过了年，老宅推平了，委托书上那个签名，再没有人问起。
      retry: true
  truth: >-
    九月，二叔罗建国趁奶奶躺在 ICU，伪造她的委托书签下拆迁协议，领走 50 万元预付款还了赌债。奶奶去世后，
    罗旭在村委看到签约登记表，准备过了头七去拆迁办查委托书。二叔花两千块让马先生定下「只留长孙守夜、门窗关严、
    纸钱烧满三盆」的规矩；去县城把奶奶唱戏的磁带转成手机文件，又买了一支同款喷雾喷空；头七下午把蓝牙音箱粘进早就坏了的戏匣子，
    晚上披外套时换掉了罗旭的喷雾。23:47，他躲在后墙外放起录音。罗旭吓得闩死了门，在满屋纸钱烟里犯了哮喘，喷雾喷不出来。
    他给许蔓打了最后一个电话，没人当真。那天夜里回过老宅的还有小姑，她只是去拿奶奶答应给她的金镯子。
