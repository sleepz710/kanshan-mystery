id: touqi
title: 头七
source: official
intro: >-
  罗家奶奶头七那晚，按马先生定的规矩，全家十点前离开老宅，只留长孙罗旭一个人守灵，门窗关严，纸钱烧满三盆。
  子时前后，路过老宅的村民都听见里面有人在唱《天仙配》，那是奶奶生前最爱的戏。可廊下奶奶那台戏匣子，五年前就不响了。
  清晨六点零八分，罗旭的妻子许蔓接到电话，来电显示是「阿旭」。打来的是马先生：灵堂门从里面闩着，撞开以后，
  罗旭倒在门边，手里攥着哮喘喷雾，人已经没了。村里都说，是奶奶回来把他带走了。许蔓不信，请来了看山谜案馆。
  你是调查员，刘看山是你的搭档。查清罗旭是怎么死的，那一夜每个人做了什么。

facts:
  - id: f1
    text: 罗家奶奶罗桂英 10 月 28 日病逝，享年八十三岁；11 月 3 日是她的头七。老宅在拆迁范围内。
  - id: f2
    text: 奶奶的遗嘱把老宅留给长孙罗旭。
  - id: f3
    text: 罗旭从小有哮喘，随身带沙丁胺醇喷雾，全家都知道；许蔓给他的每罐喷雾都用记号笔写一个「旭」字。
  - id: f4
    text: 9 月奶奶住在县医院 ICU，不能签字；二叔照着存折上的签名伪造了她的委托书，9 月 18 日以受托人身份签下老宅拆迁协议，领走 50 万元预付款还了赌债。
  - id: f5
    text: 11 月 2 日，罗旭在村委看到签约登记表：罗桂英户 9 月 18 日已签约，受托人罗建国，预付款 50 万元已发放。他拍下来发给许蔓，说头七过了就去拆迁办问委托书。
  - id: f6
    text: 11 月 3 日晚饭，罗旭问二叔老宅是不是已经签了拆迁，二叔说「哪有的事」；同一顿饭上，小姑因为遗嘱没提自己，骂了一句「你们都会遭报应」。
  - id: f7
    text: 10 月 31 日，二叔转给马先生 2000 元，让他把「只留长孙守夜、门窗关严、纸钱烧满三盆、十点前把人清走」说成老规矩。
  - id: f8
    text: 奶奶生前写过一张字条，压在卧房首饰盒里：「我走以后不请先生，不做头七，一家人吃顿饭就好。金镯子给秀。」
  - id: f9
    text: 出殡时放的奶奶唱《天仙配》的录音，是二叔 11 月 1 日在县城音像店从旧磁带转成的手机文件，文件存在他手机里。
  - id: f10
    text: 11 月 1 日 14:50，二叔在县城康安大药房买了一支和罗旭同款的沙丁胺醇喷雾，回家把药喷空。
  - id: f11
    text: 11 月 3 日下午布置灵堂时，二叔拧开廊下戏匣子的后盖，用双面胶粘进一个蓝牙音箱，换上两颗新螺丝。
  - id: f12
    text: 11 月 3 日 22:00 清人时，二叔帮罗旭披外套，把外套兜里写着「旭」字的喷雾换成了空罐。
  - id: f13
    text: 22:00 清人时，马先生看见二叔给罗旭披外套，还在外套兜上拍了两下。
  - id: f14
    text: 22:31 二叔在麻将群说出去抽根烟，骑摩托回村，把车停在老宅后墙竹林边，人躲在竹林里，离廊下不到十米。
  - id: f15
    text: 23:30 小姑用自己留的钥匙从侧门进老宅，从奶奶卧房的首饰盒里拿走金镯子和压在下面的字条。
  - id: f16
    text: 23:44 小姑在院子里拍了十秒视频：灵堂窗户透着火光，里面一阵阵咳嗽，廊下的戏匣子没有声音；最后两秒扫过后墙，竹林边停着一辆尾号 837 的摩托，是二叔的车。23:45 她截了一帧发朋友圈，第二天早上七点删掉。
  - id: f17
    text: 23:47 小姑刚出院门，戏匣子里唱起《天仙配》，唱到第三句卡了一下又从头唱。她吓得一路跑回镇上，00:30 回到旅馆。
  - id: f18
    text: 奶奶那盘《天仙配》磁带是小姑小时候摔过的，第三句一直卡；奶奶自己唱从来不卡。
  - id: f19
    text: 廊下的戏匣子五年前就坏了，电池仓锈死，电源线剪断。
  - id: f20
    text: 11 月 4 日早上，马先生发现戏匣子的后盖四颗螺丝里有两颗是新的，盖内粘着一截双面胶。
  - id: f21
    text: 二叔在竹林里看见小姑从侧门进了老宅，等她出了院门，23:47 才用手机连上音箱放录音。
  - id: f22
    text: 23:49 罗旭听见戏声，把灵堂门从里面闩死；屋里纸钱烟浓，他犯了哮喘。
  - id: f23
    text: 23:52 罗旭给许蔓打了 2 分 14 秒电话：「外头奶奶的戏匣子自己响了……门我闩上了。烟太大，喷雾喷不出来，你回来一趟。」许蔓以为他自己吓自己，说喷雾在外套另一个兜里，挂了电话。
  - id: f24
    text: 00:20 戏声停了。00:25 二叔翻进院子取走音箱，没有进灵堂，00:41 回到麻将馆。
  - id: f25
    text: 11 月 4 日 6:00 马先生来做早课，灵堂门从里面闩着；撞开后罗旭倒在门边，指甲抠进门缝，手里攥着空喷雾，已经没了呼吸。6:08 马先生用罗旭的手机打给许蔓。
  - id: f26
    text: 二叔换喷雾、放录音、买通马先生定规矩，是要让罗旭在封死的烟屋里犯病死去，看上去像哮喘意外、像被奶奶带走，这样就没人去查委托书。
  - id: f27
    text: 许蔓后悔没把那通电话当真，怕被说成是她害死了罗旭，所以一直说那晚再没联系过他。
  - id: f28
    text: 马先生只收钱改了规矩，不知道喷雾和拆迁的事；出事后他怕担责任，咬定规矩是老太太交代的。
  - id: f29
    text: 小姑以为遗嘱一样东西都没给她，回老宅是去拿奶奶生前答应给她的金镯子；她不知道二叔做了什么，那晚只当是闹鬼。
  - id: f30
    text: 许蔓和罗旭在省城工作，为奶奶的丧事回村。11 月 3 日夜里散了以后，许蔓和小姑住镇上的旅馆，二叔回镇上；许蔓十点多就睡了。
  - id: f31
    text: 罗旭手机的通话记录里，23:52 呼出「蔓蔓」2 分 14 秒，6:08 呼出「蔓蔓」40 秒，后一通是马先生打的。
  - id: f32
    text: 麻将群里，二叔 21:00 起一直在聊，22:31 发「出去抽根烟」，00:41 发「回来了，接着来」。
  - id: f33
    text: 二叔把丧事票据一股脑交给许蔓报账时，没留意里面混着康安大药房的喷雾小票。
  - id: f34
    text: 二叔把丧事的一沓票据交给许蔓报账，她这几天还没顾上细看。

characters:
  - id: xuman
    name: 许蔓
    avatar: xuman.png
    profile: 罗旭的妻子，请来看山谜案馆的委托人。
    persona: >-
      强撑着，说话克制，不信闹鬼，急着弄清丈夫是怎么死的。先讲早上接到电话、赶到灵堂的经过，交出灵堂现场的情况，
      指出那罐喷雾不是罗旭的。聊得放松一些后，主动提起小姑半夜发过又删掉的朋友圈，交出截图，觉得小姑可疑。
      问到丧事开销或二叔经手的账时，交出报销票据。提到那晚的电话就岔开；谎话没被拆穿就坚持原话，
      拆穿后崩溃自责，按已解锁的事实复述那通电话。和小姑对质时质问她为什么不进灵堂看一眼。
      只讲自己的经历和手上的材料，不替别人猜动机。
    knows: [f1, f2, f3, f5, f6, f9, f19, f23, f25, f27, f30, f31, f34]
    secrets:
