      11 月 3 日 23:45，罗秀发朋友圈：「守个灵还开一宿灯，大孝子。」配图是夜里的院子，灵堂窗户亮着。
      定位：罗家老宅。这条朋友圈第二天早上七点被删除，许蔓删除前截了图。
