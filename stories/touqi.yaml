clues:
  - id: c1
    title: 灵堂现场
    content: >-
      灵堂门闩从里面插着，三盆纸钱烧尽，满屋呛人。罗旭倒在门边，指甲抠进门缝，手里攥着一罐哮喘喷雾：
      罐是空的，罐身没有「旭」字，底部价签写着「康安大药房 11.01」。
      许蔓说：「这不是阿旭那罐。我给他的每一罐都写了字。」
    holder: xuman
  - id: c2
    title: 小姑删掉的朋友圈
