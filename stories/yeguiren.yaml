clues:
  - id: c1
    title: 老韩的遗体
    content: >-
      后坡旧羊圈东边的冲沟里，离山庄大门三百米。老韩只披着一件旧夹克，扣子没系；右手攥着对讲机，左手的手电冻得打不亮。
      大黄趴在他身边，一夜没走。韩冬说：「我爸在这座山上巡了半辈子，闭着眼都能走回家。」
    holder: handong
  - id: c2
    title: 匿名信和登记簿
    content: >-
      三封信 10 月 8 日、10 月 25 日、11 月 6 日寄到山庄，信封上写「白岭山庄 韩松年收」，信纸上只有一句手写的话：「十年前那个雪夜，你看见了什么？」
      住客登记簿 11 月 13 日那一行：林小满，江城。她写的「白岭」二字，「岭」的山字旁写得特别小，和信封上的笔迹一模一样。陆峰说：「你看这个岭字。」
    holder: lufeng
  - id: c3
    title: 羊圈边的红手套
    content: >-
      一只红色毛线手套，手腕上绣着一个「满」字。陆峰说，早上他跟阿木去找人，在旧羊圈的桩子底下捡到的，就在拴大黄的地方。
      「这事我早上没敢说。」
    holder: lufeng
    requires: {trust: 1}
  - id: c4
    title: 前台值班本
    content: >-
      11 月 14 日这一页：「22:20 锅炉添满 阿木」「23:41 门廊灯关，大门闩」，后面签的是你的名字；「01:00 交班 陆峰」。
      往前翻，十年来每一个下雪的夜里都写着同一行：「门廊灯开。」
    holder: amu
  - id: c5
    title: 老韩的对讲机
    content: >-
      从老韩手里取下的数字对讲机，停在 3 频道，电量只剩一格。通话记录：23:32 呼叫 14 秒；23:44 到 00:18 又呼叫了 9 次。
      山庄的对讲机平时都用 3 频道。
    holder: handong
    requires: {trust: 1}
  - id: c6
    title: 林小满看见的
    content: >-
      林小满说：「22:55 我在厨房打热水，老韩披着件夹克从后门出去，拿着手电和对讲机。他说：『大黄跑了，我去去就回。门口有灯，丢不了。』
      还有，我那双红手套晚饭后搭在后门的烘干架上，早上只剩一只。」
    holder: linxiaoman
    requires: {exposed: l3}
  - id: c7
    title: 林远没发出去的短信
    content: >-
      林远的旧手机里，2016 年 11 月 20 日 17:12 一条没发出去的短信，收件人「妈」：「陆哥说他下去叫人，让我在北坡雪洞里别动。」
      同年的救援通报写着：向导陆某称游客林某自行离队，往南坡方向走失，次日在北坡发现遗体。
    holder: linxiaoman
    requires: {exposed: l3, trust: 2}
  - id: c8
    title: 陆峰的对讲机
    content: >-
      陆峰那台数字对讲机，停在 3 频道，插着一副耳机。接收记录：23:32 韩松年 14 秒；23:44 到 00:18 韩松年 9 次。
      早上阿木收去充电时，它还开着。
    holder: amu
    requires: {exposed: l4}
  - id: c9
    title: 大黄项圈上的红绳
    content: >-
      半截红色登山绳，一头打着双套结，另一头断口整齐，是刀割的；老韩的小刀在他夹克口袋里。
      阿木说：「老韩拴大黄从来用铁链。链子早上还挂在狗窝上，扣是打开的。」
    holder: amu
    requires: {trust: 1}
  - id: c10
    title: 阿木看见的
    content: >-
      阿木说：「九点五十五我在厨房备柴，陆哥从后门进来，一肩膀的雪，说去锅炉房看了看。锅炉房走厨房里那道门就到，用不着出屋。」
    holder: amu
    requires: {event: e1}
  - id: c11
    title: 老韩的手表轨迹
    content: >-
      韩冬手机里同步的轨迹：22:56 出厨房后门；23:15 到后坡旧羊圈；23:20 起，一条直线往山庄大门走；23:41，离大门 140 米。
      23:41 以后，轨迹开始打转，一点点偏向东边的冲沟；00:52 不再移动。
    holder: handong
    requires: {trust: 2}
  - id: c12
    title: 老韩没写完的信
    content: >-
      山庄信纸，压在老韩桌上：「小满：十年前那天夜里，我在北坡底下碰见小陆，他说你哥在北坡的雪洞里，救援队已经去了。
      后来我才知道，他报的是南坡，救援队在南坡找了一夜。第二天一早我上了北坡……我瞒了十年。那年以后，下雪的夜里我都开着门廊灯，
      那天山上要是有盏灯，你哥兴许能自己走下来。明早我当着小陆的面说。」最后一行：「冬冬，山庄不卖了，爸对不住你。」
    holder: handong
    requires: {exposed: l5}
  - id: c13
    title: 度假村转让协议
    content: >-
      《白岭山庄整体转让协议》，受让方雪野度假集团，价款 300 万元。转让方签字处空着，被人用笔重重划了一道。
      阿木说：「韩姐上周让我去镇上帮她打印的。昨晚八点半她拿进了老韩屋里，里头吵得很凶。」
    holder: amu
    requires: {trust: 2}
  - id: c14
    title: 陆峰的交代
    content: >-
      陆峰说：「十年前我带林远走北坡，他崴了脚，我把他留在雪洞里，报给救援队的是南坡。上周老韩说，写信的人来了他就全说出来。
      我看了天气预报，14 号封山，就请了你。老韩交代关灯是我编的。九点多你还在房里，我把大黄拴到了后坡，出门时从烘干架上拿了林小满一只手套，扔在羊圈边。
      23:32 他在对讲机里说看着门口的灯往回走，我就让你去关了灯。后来他喊了九次。
      你是外人，灯是你关的，本子上是你的字，我一整晚没离开前台，你能给我作证。写信的人你也会查出来，警察来了，谁都会先想到她。」
    holder: lufeng
    requires: {exposed: l2}

events:
  - id: e1
    when: {shown: c9, to: lufeng}
    confront: [amu, lufeng]
    unlock: [c10]

kanshan:
  greeting: >-
    搭档，我是刘看山。这一夜发生的事，我都知道，其中有一件，你也在场。老规矩：你问是或不是，我只答是、不是、不重要，一共 5 次。
    先听听陆峰怎么说吧，他是你的委托人。
  hints:
    - done: {exposed: l3}
      vague: 陆峰特意让你看了登记簿。写信的人就住在楼上，你问过她吗？
      direct: 把匿名信和登记簿出示给林小满。
    - done: {exposed: l1}
      vague: 陆峰说老韩交代过关灯，一点还在打呼噜。快十一点厨房后门那一声响，是谁？
      direct: 把林小满看见的事出示给陆峰。
    - done: {event: e1}
      vague: 老韩拴大黄用铁链。项圈上那截红绳是谁的？
      direct: 多和阿木聊聊，拿到大黄项圈上的红绳，出示给陆峰。
    - done: {exposed: l4}
      vague: 老韩在雪里呼叫了十次，前台却一声没响。前台那台对讲机，早上是谁先碰的？
      direct: 和韩冬聊聊，拿到老韩的对讲机，出示给阿木。
    - done: {exposed: l2}
      vague: 前台那台对讲机一夜没响。陆峰自己那台呢？
      direct: 把阿木交出的陆峰的对讲机出示给陆峰。
    - done: {has: c11}
      vague: 老韩是看着什么往回走的？他离大门最近的时候，是几点？
      direct: 多和韩冬聊聊，问她要老韩的手表。
    - done: {exposed: l5}
      vague: 韩冬说山庄的事她从来不管。她回来这几天，阿木替她跑过一趟镇上。
      direct: 和阿木聊熟，拿到度假村的转让协议，出示给韩冬。

ending:
  questions:
    - id: q1
      text: 老韩为什么半夜去了后坡？
      options:
        - 林小满约他到外面谈十年前的事
        - 陆峰把大黄拴在了旧羊圈，老韩去找狗
        - 他喝多了，自己走出去的
      answer: 陆峰把大黄拴在了旧羊圈，老韩去找狗
    - id: q2
      text: 老韩为什么没能走回山庄？
      options:
        - 手电冻得没了电，他自己迷了路
        - 有人在冲沟边推了他一把
        - 他看着门廊灯往回走，灯被关了
      answer: 他看着门廊灯往回走，灯被关了
    - id: q3
      text: 你去关灯的时候，陆峰知道老韩在外面吗？
      options:
        - 不知道，他以为老韩早就睡了
        - 知道，他在耳机里听见老韩说看着灯往回走
        - 不知道，关灯是老韩自己交代的
      answer: 知道，他在耳机里听见老韩说看着灯往回走
    - id: q4
      text: 陆峰为什么要害老韩？
      options:
        - 他想接手山庄
        - 老韩要把他赶出山庄
        - 老韩要说出十年前林远遇难的真相
      answer: 老韩要说出十年前林远遇难的真相
    - id: q5
      text: 陆峰为什么请你上山？
      options:
        - 想查出是谁在写匿名信
        - 让你替他关灯、替他作证
        - 怕写信的人伤害老韩
      answer: 让你替他关灯、替他作证
  endings:
    - id: truth
      title: 真相大白
      when: {correct: [q3, q4, q5]}
      text: >-
        你在报告最后一页写下了自己的名字：23:41，门廊灯是你关的，陆峰在耳机里听着老韩往回走。陆峰在笔录上一个字一个字地认了，
        十年前北坡那个雪洞，终于写进了救援站的档案。林小满把哥哥的旧手机放在老韩床头，第二天下了山。韩冬没有签那份协议。
        你下山前那一夜，白岭又下雪了。你翻开值班本，在最后一行写：门廊灯开。
    - id: wronged
      title: 冤枉好人
      when: {chose: {q1: 林小满约他到外面谈十年前的事}}
      text: >-
        你把林小满写进了报告：信是她写的，晚饭上那句话是她说的，最后见到老韩的也是她，羊圈边还有她的手套。
        她被带下山问了两天话，放出来以后再没回过白岭。十年前的事，又被大雪埋了一回。
        下山那天，陆峰开车送你，一路上耳朵里塞着一只耳机。快到山脚，他摘下来递给你：「听了一宿评书，你也听听。」
        耳机线的另一头，插在一台对讲机上。
      retry: true
    - id: witness
      title: 替他作证
      when: {chose: {q3: 不知道，他以为老韩早就睡了}}
      text: >-
        你在报告里写：关灯是一场误会。陆峰编了老韩的话，是怕灯泡伤人；你们俩谁也不知道老韩在外头。
        做笔录那天，陆峰红着眼睛把值班本推到警察面前，23:41 那一行是你的字。「调查员可以作证，我一晚上没离开前台。」案子按意外结了。
        刘看山看完报告，只说了一句：「他请你上山，要的就是这份报告。」
      retry: true
    - id: accident
      title: 风雪意外
      when: {chose: {q2: 手电冻得没了电，他自己迷了路}}
      text: >-
        你在报告上写下：雪夜外出找狗，意外走失。陆峰帮韩冬料理了后事，跑前跑后。第二年开春，他接手了山庄，
        门廊那盏灯拆了，换成一块牌子：雪夜请勿外出。刘看山看完报告，只说了一句：「他没有迷路。他是看着灯往回走的。」
      retry: true
    - id: half
      title: 只查到一半
      text: >-
        你查出那一夜有人在撒谎，却说不清是谁、为了什么。韩冬签了协议，山庄换了主人。值班本收进了仓库，
        十年来那一行行「门廊灯开」，再没有人翻过。
      retry: true
  truth: >-
    十年前的雪夜，向导陆峰私带游客林远走封闭的北坡线。林远崴了脚，陆峰让他躲进雪洞等着，下山后却向救援队报称林远自行离队、往南坡走了，
    救援队在南坡找了一夜。只有在北坡底下碰见过陆峰的老韩知道林远在哪里，第二天一早他上了北坡，林远已经冻僵了。
    老韩替陆峰瞒了十年，从那年起，每个下雪的夜里都开着门廊灯。今年，林远的妹妹林小满寄来三封匿名信，老韩决定说出来。
    陆峰看准封山的日子，以查匿名信为由请你上山。那一夜，他趁你还在房里，把大黄拴到后坡的旧羊圈，在桩子底下扔了一只林小满的手套；
    又把前台对讲机调到 6 频道，自己戴着耳机守在 3 频道，对你说老韩交代过睡前关灯。老韩听见狗叫，对林小满说了句「门口有灯，丢不了」，出门找狗。
    23:32，老韩在对讲机里说，他看着门口的灯往回走。6 分钟后，陆峰说不早了，让你照老韩的交代去关灯。
    23:41，你关了灯，闩了门，在值班本上签了名。那一刻，老韩离大门 140 米。
