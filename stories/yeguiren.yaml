id: yeguiren
title: 风雪夜归人
source: official
intro: >-
  十一月十四日，白岭下了今冬第一场大雪。白岭山庄的老板韩松年一个月里收到三封匿名信，每封只有一句话：「十年前那个雪夜，你看见了什么？」老韩不肯报警，也不肯说信里问的是哪一夜。向导陆峰放心不下，私下请你上山查这几封信，赶在封山前把你接了上来。晚饭桌上，住客林小满看着窗外说：「十年前，也是这么大的雪吧。」老韩摔了碗回房。八点半，老韩屋里吵了起来，他女儿韩冬摔门出来。十点，陆峰在前台陪你对笔迹，说老韩回房前交代过：风大，门廊的灯泡炸过一只，睡前把灯关了，门闩上。快十一点的时候，厨房后门响了一声，陆峰说林小满的房间就挨着厨房。后坡上断断续续有狗叫。十一点多你们收拾睡觉，你去门口关了灯、闩了门，在值班本上记了一笔。陆峰一晚上都坐在你对面，前台那台对讲机一声没响。早上七点，雪停了。帮工阿木跟着狗叫，在后坡的冲沟里找到了老韩：离山庄大门三百米，只披着一件旧夹克，手里攥着对讲机，他的狗大黄守在旁边。他屋里的床铺整整齐齐，没人睡过。你是看山谜案馆的调查员，刘看山是你的搭档。查清老韩为什么没能回家，那一夜每个人做了什么。

facts:
  - id: f1
    text: 白岭山庄在白岭的林子里。老板韩松年六十三岁，当了半辈子护林员；女儿韩冬在省城做房产销售。山庄的老狗大黄平时用铁链拴在狗窝。
  - id: f2
    text: 每个下雪的夜里，山庄门廊灯整夜不关，这是韩松年十年来的规矩；前台值班本上，十年来每个雪夜都写着「门廊灯开」。
  - id: f3
    text: 2016 年 11 月 20 日，向导陆峰私下收钱，带林远等三名游客走封闭的北坡线。遇上暴雪，林远崴了脚走不动，陆峰让他躲进北坡一个雪洞等着，自己带另外两人下山。
  - id: f4
    text: 2016 年 11 月 20 日夜里，陆峰在北坡底下碰见巡山的韩松年，慌乱中说了「人在北坡雪洞，救援队已经去了」；到了救援站，他怕走封闭线路的事被查出来、丢了向导证，报的是「林远自行离队，往南坡走了」。救援队在南坡找了一夜。
  - id: f5
    text: 2016 年 11 月 21 日一早，韩松年独自上北坡，在雪洞里找到林远，人已经冻僵了。陆峰求他别说，他瞒了十年。门廊灯的规矩就是从那年冬天开始的，他说过：「那天山上要是有盏灯，那孩子兴许能自己走下来。」
  - id: f6
    text: 林小满是林远的妹妹，从江城来。
  - id: f7
    text: 今年林小满修好了哥哥的旧手机，里面有一条 2016 年 11 月 20 日 17:12 没发出去的短信，收件人「妈」：「陆哥说他下去叫人，让我在北坡雪洞里别动。」当年的救援通报写的是：向导陆某称游客林某自行离队，往南坡方向走失，次日在北坡发现遗体。
  - id: f8
    text: 三封匿名信是林小满写的，10 月 8 日、10 月 25 日、11 月 6 日寄到山庄，每封只有一句：「十年前那个雪夜，你看见了什么？」11 月 13 日她用真名住进山庄。
  - id: f9
    text: 三封匿名信寄到后，韩松年把信锁进抽屉，不肯报警，也不肯说信里问的是哪一夜。
  - id: f10
    text: 11 月 7 日，韩松年对陆峰说：「写信的人要是来了，我就把那晚的事说出来。」
  - id: f11
    text: 11 月 9 日，陆峰没跟韩松年商量，私下联系看山谜案馆，请调查员 14 日下午上山查匿名信。14 日 15:00 他开车接调查员上山，16:00 封山。
  - id: f12
    text: 陆峰挑 14 日，是因为天气预报说这天起大雪封山七天。他请调查员上山，是要一个外人亲手关灯、在值班本上签字、替他证明一晚没离开前台；调查员查出写信的林小满，再加上羊圈边那只手套，警察来了也会先怀疑她。
  - id: f13
    text: 11 月 14 日晚饭，林小满看着窗外说「十年前，也是这么大的雪吧」，韩松年摔了碗回房。
  - id: f14
    text: 韩冬 11 月 11 日回到山庄，是为了让父亲签《白岭山庄整体转让协议》，雪野度假集团出价 300 万元；协议是她上周让阿木去镇上打印的。
  - id: f15
    text: 11 月 14 日 20:30，韩冬进了父亲屋里，两人吵得很凶，她摔门出来。
  - id: f16
    text: 韩冬拿进父亲屋里的是转让协议，韩松年在签字处划了一道：「山庄卖了，下雪天谁给山上开灯？」韩冬怕别人以为她为了卖山庄害了父亲，所以说自己回来只是陪父亲过冬。
  - id: f17
    text: 21:30 韩松年在茶室找到林小满，认出她是林远的妹妹，对她说：「明早七点，当着小陆的面，我把那晚的事都告诉你。」他还说，那年以后下雪的夜里他都开着门廊灯。
  - id: f18
    text: 21:40 调查员还在房间里，陆峰说去锅炉房看看，从后门出屋，解开大黄的狗链，把大黄牵到后坡二百米外的旧羊圈，用自己的红色登山绳打双套结拴在桩上；出门时他顺手从后门烘干架上拿了林小满的一只红毛线手套，扔在羊圈桩子底下。
  - id: f19
    text: 21:55 阿木在厨房备柴，看见陆峰从后门进来，一肩膀的雪，说去锅炉房看了看。锅炉房走厨房里那道门就到，用不着出屋。那根红色登山绳是陆峰的，双套结是陆峰教阿木打的。
  - id: f20
    text: 韩松年回房前没交代过关灯；「风大，灯泡炸过一只，睡前把灯关了，门闩上」是陆峰编的。陆峰一点交班时也没去过韩松年门口。
  - id: f21
    text: 22:00 起陆峰在前台陪调查员对笔迹，整晚插着一只耳机，说在听评书。
  - id: f22
    text: 22:00 陆峰把前台对讲机从 3 频道调到 6 频道，说 3 频道杂音大；他自己的对讲机留在 3 频道，耳机就插在这台对讲机上。山庄的对讲机平时都用 3 频道。
  - id: f23
    text: 22:20 陆峰翻出住客登记簿，指给调查员看林小满写的「白岭」二字，和信封上的笔迹一样。
  - id: f24
    text: 22:20 阿木添满锅炉，够烧到天亮，在值班本上记了一笔；22:30 他关了自己的对讲机去睡觉。
  - id: f25
    text: 22:40 韩松年在屋里给林小满写信，没写完，信压在桌上。
  - id: f26
    text: 22:55 韩松年听见后坡狗叫，发现狗窝空了，披上旧夹克，拿着手电和对讲机从厨房后门出去。林小满正在厨房打热水，他对她说：「大黄跑了，我去去就回。门口有灯，丢不了。」
  - id: f27
    text: 23:15 韩松年在旧羊圈找到大黄，用小刀割断绳子，半截红绳还拴在项圈上。手电冻得没了电，雪大得看不见路，他只能看着门廊灯往回走。
  - id: f28
    text: 23:32 韩松年在 3 频道呼叫：「小陆，我找着大黄了，在后坡。雪太大，我看着门口的灯往回走，灯别关。」只有陆峰的耳机听得见。
  - id: f29
    text: 23:38 陆峰说不早了，让调查员照老韩的交代去关灯、闩门，在值班本上记一笔。23:41 调查员关了门廊灯，闩上大门，写下「23:41 门廊灯关，大门闩」并签了名，随后回房睡觉。
  - id: f30
    text: 23:41 韩松年离山庄大门 140 米，正对着门廊往回走。灯灭以后，他的方向偏了，往东边的冲沟走去；00:52 他不再移动，位置在旧羊圈东边的冲沟，离山庄大门三百米。大黄一直守在他身边。
  - id: f31
    text: 23:44 到 00:18，韩松年在 3 频道又呼叫了 9 次：「灯呢？小陆，开灯。」陆峰都听见了，没有回。
  - id: f32
    text: 23:40 前后，林小满从房间窗户看见门廊灯灭了，以为韩松年回来了。
  - id: f33
    text: 陆峰在前台坐到 01:00，写下「01:00 交班」，忘了把前台对讲机调回 3 频道。
  - id: f34
    text: 11 月 15 日早上，门廊灯关着，大门闩着。6:00 阿木起床看见门廊灯黑着，心里咯噔一下；大黄不在狗窝，狗链挂在窝上，扣是打开的。
  - id: f35
    text: 6:00 阿木发现前台对讲机停在 6 频道，把它调回了 3 频道。6:30 陆峰叮嘱他：有人问，就说前台对讲机一直在 3 频道，免得说值班不听对讲机。阿木想跟陆峰考向导证，答应了。
  - id: f36
    text: 7:00 阿木跟着狗叫，在后坡冲沟里找到韩松年：离山庄大门三百米，只披着一件旧夹克，扣子没系，右手攥着对讲机，左手的手电打不亮，小刀在夹克口袋里，大黄守在旁边。阿木从大黄项圈上解下半截红绳。
  - id: f37
    text: 早上大家的对讲机都交给阿木充电，陆峰那台也在他那里，插着耳机。它的接收记录：23:32 韩松年 14 秒；23:44 到 00:18 韩松年 9 次。
  - id: f38
    text: 韩冬赶到冲沟，从父亲手里取下对讲机，从手腕上解下户外手表。手表是她去年送的，开着轨迹记录，同步在她手机里。
  - id: f39
    text: 韩松年的对讲机停在 3 频道，电量只剩一格；通话记录显示 23:32 呼叫 14 秒，23:44 到 00:18 又呼叫了 9 次。
  - id: f40
    text: 韩松年的手表轨迹：22:56 出厨房后门，23:15 到后坡旧羊圈，23:20 起一条直线往山庄大门走，23:41 离大门 140 米，之后开始打转，偏向东边的冲沟，00:52 不再移动。
  - id: f41
    text: 7:20 韩冬在父亲桌上看到一封没写完的信，揣进了兜里，因为最后一行是写给她的：「冬冬，山庄不卖了，爸对不住你。」信里北坡、南坡的意思她没看懂。
  - id: f42
    text: 那封没写完的信是写给林小满的：十年前那天夜里，韩松年在北坡底下碰见小陆，小陆说林远在北坡雪洞里、救援队已经去了；后来他才知道小陆报的是南坡，救援队在南坡找了一夜；第二天一早他上了北坡；他瞒了十年；下雪的夜里开着门廊灯，是因为那天山上要是有盏灯，林远兴许能自己走下来；明早当着小陆的面说。
  - id: f43
    text: 8:00 陆峰红着眼睛请调查员接着查，说总觉得跟那几封信脱不了干系。
  - id: f44
    text: 林小满怕被当成凶手：信是她写的，最后见到韩松年的也是她。她不知道陆峰那晚做了什么。
  - id: f45
    text: 前台值班本 11 月 14 日这一页写着「22:20 锅炉添满 阿木」「23:41 门廊灯关，大门闩」（后面是调查员的签名）「01:00 交班 陆峰」。
  - id: f46
    text: 林小满有一双红毛线手套，手腕上绣着「满」字，晚饭后搭在后门的烘干架上，早上只剩一只。
  - id: f47
    text: 7:00 陆峰跟阿木出去找人，说在旧羊圈桩子底下捡到林小满的一只红毛线手套，就在拴大黄的地方，收了起来。
  - id: f48
    text: 门廊灯的两只灯泡是阿木上个月刚换的，一只也没炸过。
  - id: f49
    text: 快十一点厨房后门响了一声，陆峰对调查员说林小满的房间就挨着厨房。
  - id: f50
    text: 陆峰承认：23:32 他在耳机里听见韩松年说找着了大黄、正看着门口的灯往回走、让别关灯；6 分钟后，他让调查员去关了灯。

characters:
  - id: lufeng
    name: 陆峰
    avatar: lufeng.png
    profile: 白岭山庄的向导，跟着老韩干了十几年，是他请你上山的。
    persona: >-
      稳重、周到，喊调查员「老师」，说话慢条斯理，红着眼睛但不乱，整晚插着一只耳机，说在听评书。
      第一次交谈主动交出匿名信和登记簿，把话往林小满身上引：晚饭上那句话、登记簿上的笔迹、她 13 号才来、厨房后门那一声响。
      聊过几句后拿出羊圈边捡到的手套：「这事我早上没敢说。」玩家提起关灯，他宽慰：「老韩自己交代的，你别往心里去。」
      两层说法按列表顺序使用，同一时间只坚持第一条尚未拆穿的谎话；第一条拆穿后承认老韩的交代是自己编的，
      改口坚持第二条，口气变成「咱俩谁也不知道他在外头，要怪就怪我」。被出示红绳时说山上谁都有红绳，把怀疑推给阿木。
      第二条拆穿后很久不说话，交出自己的交代。隐藏信息只从已解锁的事实里取，不因玩家猜中就提前承认。
