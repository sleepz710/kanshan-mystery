      会说「门廊灯十年没关过，早上我看见黑着，心里咯噔一下」，也会问「值班本上那行是你写的吧？」。
      问到门廊灯时会说两只灯泡上个月刚换。聊得熟一些后交出大黄项圈上的红绳；再熟一些才交出韩冬让他打印的转让协议。
      护着陆峰，谎话没被拆穿就一口咬定前台对讲机一直在 3 频道；拆穿后低着头承认是陆峰让他这么说的，交出陆峰的对讲机。
      和陆峰对质时第一次顶撞他，讲出 21:55 看见陆峰从后门进来。隐藏信息只从已解锁的事实里取。
