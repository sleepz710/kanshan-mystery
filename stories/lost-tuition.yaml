      两层说法按列表顺序使用，同一时间只坚持第一条尚未拆穿的谎话，前一条拆穿后再用后一条。
      证据把说法拆穿后就承认对应事实，不继续重复旧谎话。
      全部拆穿后沉默、后悔，交出能提供的聊天记录。
      隐藏信息只从已解锁的事实里取，不因玩家猜中就提前承认。
    knows: [f7, f9, f11, f12, f13, f14, f15, f16, f17, f19, f21, f23]
    secrets:
      - fact: f7
        until: {exposed: l4}
      - fact: f9
        until: {exposed: l5}
      - fact: f11
        until: {exposed: l4}
      - fact: f12
        until: {exposed: l5}
      - fact: f13
        until: {exposed: l5}
      - fact: f14
        until: {exposed: l5}
      - fact: f15
        until: {exposed: l5}
      - fact: f16
        until: {exposed: l5}
      - fact: f23
        until: {exposed: l5}
    lies:
      - id: l4
        claim: 收卡、刷单我都不清楚，周明我也不太熟。
        until: {shown: c7}
        admit: f11
      - id: l5
        claim: 那天是网友托我取个快递，我不知道里面是卡。
        until: {exposed: l4, shown: c9}
        admit: f13
    trust_start: 0

