    holder: chenmo

events:
  - id: e1
    when: {shown: c3, to: xiaolin}
    confront: [xiaolin, akai]
    unlock: [c5]

kanshan:
  greeting: >-
    搭档，我是刘看山。这案子的来龙去脉我都知道，不过规矩是：
    你问是或不是，我只答是、不是、不重要，一共 5 次。先去听听小林怎么说吧。
  hints:
    - done: {has: c4}
      vague: 回单上写着谁的名字，钱就一定在谁手里吗？
      direct: 去找阿凯聊聊，再把转账回单拿给他看。
    - done: {exposed: l3}
      vague: 周明说卡丢了。有人能证明他在撒谎吗？
      direct: 把楼层群截图出示给周明。
    - done: {exposed: l5}
      vague: 卡是有人当面取走的。付款记录上的名字，有时候只露一个字。
      direct: 先把卖卡聊天记录给陈默看，再把收款记录给他看。
    - done: {exposed: l1}
      vague: 小林说他一分钱没赚到，阿凯手里的聊天记录可不是这么说的。
      direct: 把阿凯和小林的聊天截图出示给小林。
    - done: {has: c6}
      vague: 阿凯说自己什么好处都没拿，那他自己有没有亏过钱？
      direct: 再和阿凯多聊几句，问问他自己做单的经历。

ending:
  questions:
    - id: q1
      text: 两万元为什么会进周明名下的卡？
      options:
        - 周明就是骗子
        - 周明把卡卖了，卡在骗子手里收钱
        - 小林转错了账户
      answer: 周明把卡卖了，卡在骗子手里收钱
    - id: q2
      text: 周明的卡是谁收走的？
      options:
        - 阿凯
        - 一个不认识的外校人
        - 陈默，用小号「鹿鸣兼职」收的
      answer: 陈默，用小号「鹿鸣兼职」收的
    - id: q3
      text: 小林是怎么进刷单群的？
      options:
        - 陈默在兼职群发广告，阿凯进群后拉了小林
        - 小林自己在网上搜到
        - 周明拉他进的
      answer: 陈默在兼职群发广告，阿凯进群后拉了小林
    - id: q4
      text: 阿凯在这件事里是什么角色？
      options:
        - 骗子的同伙
        - 和这件事无关
        - 被利用来拉人，自己也被骗了钱
      answer: 被利用来拉人，自己也被骗了钱
    - id: q5
      text: 陈默为什么主动陪小林来报案？
      options:
        - 真心想帮小林
        - 想打听查到了哪一步，把怀疑引到周明身上
        - 想从赔偿里抽成
      answer: 想打听查到了哪一步，把怀疑引到周明身上
  endings:
    - id: truth
      title: 真相大白
      when: {correct: [q2, q5]}
      text: >-
        陈默在活动室里坐了很久，最后自己拨通了 110。周明和阿凯把手里的聊天记录、转账记录都交了出来，
        小林带着一整条证据链去派出所做了笔录。三天后，楼层群里那个叫「鹿鸣兼职」的号注销了。
    - id: wronged
      title: 冤枉好人
      when: {chose: {q1: 周明就是骗子}}
      text: >-
        你把周明的名字写进了报告。周明被叫去派出所问话，陈默「热心」地陪小林去作证，
        说周明暑假到处借钱。两周后，楼层群里又出现了一条消息：「收银行卡，一张 500，不用你做任何事。」
      retry: true
    - id: half
      title: 只查到一半
      text: >-
        你查清了周明卖卡的事，却没查到是谁收走了那张卡。周明为五百块付出了代价，
        收卡的人还住在这栋楼里，每天在兼职群里热心地回答新生的问题。
      retry: true
  truth: >-
    小林的两万元，转进了周明 8 月 20 日卖掉的那张卡。卡、网银密码和手机卡都在骗子手里，
    钱进卡十分钟就被转走了。收走这张卡的，是楼里人缘最好的陈默学长：他欠了五万网贷，
    用小号「鹿鸣兼职」一个暑假收了 6 张学生的卡，每张收卡报酬 1500 元，付给学生 500 元；
    刷单群的广告也是他发在兼职群里的。阿凯从他的群进了刷单群，又拉了小林，拿到 50 元奖励，
    自己也被骗走 800 元。小林先做了两单小额任务，收到返利后信以为真，最终垫出了学费。
    陈默陪小林来报案，是想知道查到了哪一步，让周明替他背锅。
  lessons:
    - 刷单的套路是「先给甜头、再要垫资、最后说冻结」。要你先交钱才能提现的，都是骗局。
    - 出售或出借银行卡、手机卡，可能构成帮助信息网络犯罪活动罪。收卡的人可能就是你身边的熟人。
    - 被骗后立即停止转账，保存聊天和转账记录，马上报警，并联系银行申请止付。
