id: lost-tuition
title: 一笔消失的学费
source: official
intro: >-
  开学第三天，大一新生小林的两万元学费没了。钱转进了隔壁宿舍周明的银行卡，
  可周明说这笔钱他一分也没见过。陪小林来报案的陈默学长说：「我早就觉得周明不对劲。」
  你是校反诈社团的调查员，刘看山是你的搭档。查清这两万元是怎么没的，这件事里每个人做了什么。

facts:
  - id: f1
    text: 刷单群先安排小单返利，再要求垫资连单，提现时以账户冻结为由要求继续交钱。
  - id: f2
    text: 8 月 28 日 21:40，小林把两万元学费转进户名周明的银行卡；客服随后要求再交三万元解冻，小林没有继续转账。
  - id: f3
    text: 小林在 8 月 25 日垫 100 元收到 110 元，8 月 26 日垫 300 元收到 330 元，两单共赚了 40 元。
  - id: f4
    text: 8 月 25 日，阿凯把刷单群链接发给小林，吹嘘「已经赚了好几百」。
  - id: f5
    text: 阿凯拉小林进刷单群后，在 8 月 25 日收到 50 元推广奖励。
  - id: f6
    text: 8 月 27 日，阿凯垫资 800 元做连单，第三单被说「操作超时」，钱没有退回；他因丢脸又盼着退款，没有提醒小林。
  - id: f7
    text: 8 月 21 日，陈默在「7 栋兼职互助群」发刷单群二维码，写着「暑期在家刷单，一单一结，我自己做过，靠谱」。
  - id: f8
    text: 阿凯在陈默建的「7 栋兼职互助群」看到刷单广告，8 月 22 日扫码进群，自己拿到的返利不到 30 元，起初相信兼职可靠。
  - id: f9
    text: 8 月 20 日，楼层群里的「鹿鸣兼职」发消息收银行卡，一张 500 元；周明在下面问过「这个靠谱吗」。
  - id: f10
    text: 周明私聊鹿鸣兼职，把自己的银行卡、网银密码和一张手机卡以 500 元卖给对方，卡没有丢失。
  - id: f11
    text: 鹿鸣兼职对周明说「我同学陈默八点到你楼下取」；8 月 20 日 20:00，陈默取走信封，周明当时以为他只是替人跑腿。
  - id: f12
    text: 8 月 20 日晚，周明收到 500 元卖卡款，收款记录的付款方实名显示「*默」。
  - id: f13
    text: 陈默就是小号「鹿鸣兼职」的使用者，他亲自收走周明的卡并付款，再把卡交给老K。
  - id: f14
    text: 陈默大二时借了三万元网贷，债务滚到五万元；他为还债替老K收卡、在兼职群发刷单广告。
  - id: f15
    text: 今年七月，网友老K与陈默谈好每收一张学生银行卡付 1500 元，每拉一人进刷单群另付 30 元；陈默给卖卡学生 500 元，一个暑假收了 6 张卡。
  - id: f16
    text: 9 月 1 日，陈默得知小林的钱进了周明的卡，主动陪小林报案，是为打听调查进度、把怀疑引到周明身上并维持热心学长的形象。
  - id: f17
    text: 周明暑假打游戏充值花光生活费，曾在楼里找几个人借钱；陈默保存了相关聊天截图。
  - id: f18
    text: 周明的卡在 8 月 20 日卖出后已由骗子控制；小林的两万元入账十分钟内就被转到其他账户，周明没有拿到这两万元。
  - id: f19
    text: 8 月 29 日刷单群解散，客服失联；9 月 1 日陈默陪小林来到反诈社团。
  - id: f20
    text: 小林来自县城，两万元学费是父母攒了两年的钱；他想兼职减轻家里负担，迎新时陈默帮他扛行李，他很信任学长。
  - id: f21
    text: 陈默是大三学生、「7 栋兼职互助群」群主和迎新志愿者，在楼里人缘很好。
  - id: f22
    text: 阿凯拉小林时不知道这是诈骗；他自己也被骗，拿推广奖励和没有及时提醒小林让他十分愧疚。
  - id: f23
    text: 陈默知道自己取走的信封里是银行卡、网银密码和手机卡；他只是收卡和推广的中间人，不是诈骗团伙头目，也不知道老K的真实身份。
  - id: f24
    text: 8 月 25 日，小林进刷单群后回阿凯「刚到账 110，真香」；阿凯保存了这段聊天。

characters:
  - id: xiaolin
    name: 小林
    avatar: xiaolin.png
    profile: 大一新生，两万元学费被骗走，由陈默学长陪着来报案。
    persona: >-
      内向、要面子，着急又自责，怕父母知道后失望。对迎新时帮助过自己的陈默学长很信任。
      先讲自己遇到的事，问到兼职和付款时交出群聊记录与回单；推荐人的信息解锁后再说名字。
      谎话没被拆穿就坚持原话；拆穿后按已解锁的事实承认，交出对应材料。
      和阿凯对质时追问他拉自己进群是否拿了钱，表达受伤和愤怒。
      只讲自己的经历和当前证据，不替别人解释动机。
    knows: [f1, f2, f3, f4, f19, f20, f21, f24]
    secrets:
      - fact: f3
        until: {exposed: l1}
      - fact: f4
        until: {trust: 1}
      - fact: f24
        until: {exposed: l1}
    lies:
      - id: l1
        claim: 我一开始就被骗了，一分钱没赚到。
        until: {shown: c3}
        admit: f3
    trust_start: 0

  - id: akai
    name: 阿凯
    avatar: akai.png
    profile: 小林的室友，大一新生，外向，爱聊兼职和游戏。
    persona: >-
      外向、爱吹牛、好面子，开头觉得自己只是分享兼职，对陈默学长没有怀疑。
      聊到自己和小林的聊天，在信任度允许时交出截图；问到刷单群从哪来时，
      交出已可提供的兼职互助群截图。看到回单上的户名后，回忆楼层群里的收卡消息。
      秘密解锁后才讲相应经历；对质时先嘴硬，被追问后按已解锁的事实回答。
      不把自己不知道的收卡内幕说成亲眼所见。
    knows: [f1, f4, f5, f6, f7, f8, f9, f21, f22, f24]
    secrets:
      - fact: f4
        until: {trust: 1}
      - fact: f5
        until: {exposed: l2}
      - fact: f6
        until: {trust: 2}
      - fact: f7
        until: {trust: 1}
      - fact: f8
        until: {trust: 1}
      - fact: f9
        until: {shown: c2}
      - fact: f22
        until: {trust: 2, exposed: l2}
      - fact: f24
        until: {trust: 1}
    lies:
      - id: l2
        claim: 我就随手转了个链接，什么好处都没拿。
        until: {event: e1}
        admit: f5
    trust_start: 0

  - id: zhouming
    name: 周明
    avatar: zhouming.png
    profile: 隔壁宿舍的大二学生，回单上的收款账户在他名下。
    persona: >-
      话少、紧张，回避账户的问题，怕自己闯祸。被证据拆穿前坚持谎话，
      拆穿后按已解锁的事实说明经过、交出材料。自己的经历讲得具体，别人的身份不乱猜。
      面对回单时承认卡是自己名下的，但没有收到小林交的两万元。
      不用法律术语替自己辩解，问到责任时表现出害怕和后悔。
    knows: [f9, f10, f11, f12, f17, f21]
    secrets:
      - fact: f9
        until: {exposed: l3}
      - fact: f10
        until: {exposed: l3}
      - fact: f11
        until: {exposed: l3}
      - fact: f12
        until: {exposed: l3}
    lies:
      - id: l3
        claim: 那张卡早就丢了，谁在用我也不知道。
        until: {shown: c4}
        admit: f10
    trust_start: 0

  - id: chenmo
    name: 陈默
    avatar: chenmo.png
    profile: 大三学长，兼职互助群群主，陪小林来报案的迎新志愿者。
    persona: >-
      说话亲切，熟悉校园生活，主动帮忙，留意调查员手里有什么证据。
