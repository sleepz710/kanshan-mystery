  - id: c7
    title: 周明和鹿鸣兼职的聊天
    content: >-
      8 月 20 日，鹿鸣兼职向周明要银行卡、网银密码和一张手机卡，答应付 500 元。
      周明答应后，对方最后发来：「我同学陈默八点到你楼下取。」
