      小林转出两万元后申请提现，客服改口「账户冻结，再交三万才能解冻」。
      8 月 29 日群聊解散，客服失联。
    holder: xiaolin
  - id: c2
    title: 两万元转账回单
    content: >-
      8 月 28 日 21:40，小林转出 20000 元，收款账户户名为周明，正是隔壁宿舍的学生。
      小林说这是父母为他攒的学费。
    holder: xiaolin
  - id: c3
    title: 阿凯和小林的聊天
    content: >-
      8 月 25 日，阿凯发来刷单群链接：「我做了几单，已经赚了好几百。」
      当晚小林回复：「刚到账 110，真香。」
