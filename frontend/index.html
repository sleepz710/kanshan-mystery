<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>看山谜案馆 · AI 推理剧场</title>
  <meta name="description" content="和各怀秘密的 AI 角色对话、出示证据、拆穿谎话，查出真相。">
  <meta name="theme-color" content="#0b0e16">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
  <script src="/js/ui.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/store.js" defer></script>
  <script src="/studio/chats.js" defer></script>
  <script src="/js/home.js" defer></script>
</head>
<body class="page-home" data-view="title">
  <!-- 夜山画面按 1600×900 绘制，铺满窗口；三个视图共用，切换时不重建 -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="cloud" style="left: 1080px; top: 176px; width: 300px; height: 30px"></div>
    <div class="cloud" style="left: 1240px; top: 214px; width: 210px; height: 22px; animation-duration: 62s"></div>
    <svg viewBox="0 0 1600 900" width="1600" height="900">
      <path d="M0 520 C140 470 240 430 360 450 C470 468 560 380 690 360 C800 344 880 420 990 410 C1110 398 1210 330 1330 352 C1440 372 1520 430 1600 420 V900 H0Z" fill="#232b3c"/>
    </svg>
    <div class="mist" style="left: 120px; top: 430px; width: 980px; height: 120px"></div>
    <svg viewBox="0 0 1600 900" width="1600" height="900">
      <path d="M0 610 C120 580 220 540 330 560 C430 578 520 520 640 500 C760 480 860 560 960 548 C1010 542 1040 528 1060 524 C1080 528 1120 540 1180 556 C1290 584 1400 540 1490 552 C1540 558 1580 570 1600 574 V900 H0Z" fill="#1a2030"/>
      <path d="M1014 526 L1106 526 L1092 516 Q1060 500 1028 516 Z" fill="#0f131d"/>
      <rect x="1026" y="526" width="68" height="34" fill="#0f131d"/>
      <path d="M1018 548 L1102 548 L1092 540 L1028 540 Z" fill="#0f131d"/>
      <rect x="1036" y="520" width="48" height="6" fill="#0f131d"/>
      <rect class="window" x="1053" y="531" width="14" height="13" fill="#f3c46b"/>
    </svg>
    <div class="window-glow"></div>
    <div class="lamps" id="lamps"></div>
    <div class="mist" style="left: 420px; top: 560px; width: 1200px; height: 150px; animation-duration: 42s"></div>
    <svg viewBox="0 0 1600 900" width="1600" height="900">
      <path d="M0 740 C160 700 300 720 460 730 C640 742 760 690 920 700 C1080 710 1200 760 1360 744 C1460 734 1540 712 1600 716 V900 H0Z" fill="#11151f"/>
      <path d="M1380 744 L1410 660 L1440 744 Z M1420 746 L1456 640 L1492 746 Z M1470 748 L1498 676 L1526 748 Z" fill="#0c0f17"/>
      <path class="title-only" d="M60 750 L88 680 L116 750 Z M100 752 L132 662 L164 752 Z" fill="#0c0f17"/>
      <path d="M0 830 C200 806 420 820 640 826 C900 834 1140 806 1360 812 C1480 816 1560 826 1600 830 V900 H0Z" fill="#090b11"/>
    </svg>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <!-- 界面也按 1600×900 排版，按窗口高度等比缩放，宽度随窗口比例伸缩 -->
  <div class="ui" id="ui">
    <section class="view view-title" id="view-title" aria-label="标题画面">
      <header class="title-head">
        <img src="/assets/logo.svg" alt="看山徽标" width="72" height="72">
        <div>
          <h1>看山谜案馆</h1>
          <p>AI 推理剧场 · 每个人都有秘密</p>
        </div>
      </header>

      <nav class="menu" id="menu-main" aria-label="主菜单">
        <a class="item" id="item-continue" href="/game.html" hidden>
          <span class="mark"></span><span class="label">继续调查</span><span class="meta" id="continue-meta"></span>
        </a>
        <button class="item big" type="button" id="item-start" data-default>
          <span class="mark"></span><span class="label">开始探案</span>
        </button>
        <a class="item" id="item-settings" href="/settings/" hidden>
          <span class="mark"></span><span class="label">模型设置</span><span class="meta" id="settings-meta"></span>
        </a>
        <button class="item" type="button" id="item-quit" hidden>
          <span class="mark"></span><span class="label">退出</span>
        </button>
      </nav>

      <nav class="menu" id="menu-start" aria-label="开始探案" hidden>
        <p class="menu-title">开始探案</p>
        <a class="item big" href="#cases" data-view="cases" data-default>
          <span class="mark"></span><span class="label">从已有剧场游玩</span>
        </a>
        <a class="item" href="#new" data-view="new">
          <span class="mark"></span><span class="label">新建剧场</span>
        </a>
        <button class="item" type="button" data-back>
          <span class="mark"></span><span class="label">返回</span>
        </button>
      </nav>

      <div class="sound">
        <button class="toggle" type="button" id="toggle-music" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          <span>音乐 <b>开</b></span>
        </button>
        <button class="toggle" type="button" id="toggle-sfx" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <span>音效 <b>开</b></span>
        </button>
        <span class="version">v1.0</span>
      </div>
    </section>

    <section class="view view-cases" id="view-cases" aria-labelledby="cases-title" hidden>
      <header class="page-head">
        <img src="/assets/logo.svg" alt="" width="52" height="52">
        <h1 id="cases-title">从已有剧场游玩</h1>
      </header>
      <div class="shelves" id="shelves" aria-busy="true"></div>
      <nav class="back-nav" aria-label="返回">
        <button class="item" type="button" data-back>
          <span class="mark"></span><span class="label">返回</span>
        </button>
      </nav>
    </section>

    <section class="view view-new" id="view-new" aria-labelledby="new-title" hidden>
      <header class="page-head">
        <img src="/assets/logo.svg" alt="" width="52" height="52">
        <h1 id="new-title">新建剧场</h1>
      </header>
      <form class="new-form" id="new-form" autocomplete="off">
        <p class="new-lead">把素材交给编剧，他会改编成一桩有人物、证据和谎话的案子，谜底留给你自己查。</p>
        <div>
          <label class="field-label" for="material">素材</label>
          <div class="material" id="material-box">
            <textarea id="material" rows="3" maxlength="20000" placeholder="一碗海龟汤、一段小说、一个网址，或者一句「我想玩一个发生在……的案子」"></textarea>
            <ul class="attachments" id="attachments" aria-label="待发送的附件"></ul>
            <div class="material-foot">
              <button class="chip" type="button" id="btn-upload">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21.4 11.6l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
                上传 txt / md
              </button>
              <input type="file" id="file-input" accept=".txt,.md,text/plain,text/markdown" multiple hidden>
              <span class="material-note" id="material-note">网址会自动读取正文</span>
            </div>
          </div>
        </div>
        <div class="starters" id="starters"></div>
        <div class="go-row">
          <button class="go" type="submit" id="btn-go">交给编剧</button>
          <span class="go-note" id="go-note">编剧会问你要快速还是精修<br>生成完会出现在「我的剧场」</span>
        </div>
      </form>
      <nav class="back-nav" aria-label="返回">
        <button class="item" type="button" data-back>
          <span class="mark"></span><span class="label">返回</span>
        </button>
      </nav>
    </section>
  </div>

  <div class="launch" id="launch" hidden>
    <div class="launch-box">
      <img src="/assets/logo.svg" alt="" width="72" height="72">
      <p>正在布置现场……</p>
    </div>
  </div>
</body>
</html>
