    text: 你已经看出这不是闹鬼，而是有人借断电、监控盲区和搬尸制造假象，但目前证据链还不足以完整锁定断电者、病房内关氧者与搬尸执行者的全部责任。继续追查地下室监控、B-12床栏录音和货梯后的去向，才能追回名单并彻底揭穿整场伪装。
    when: {}
