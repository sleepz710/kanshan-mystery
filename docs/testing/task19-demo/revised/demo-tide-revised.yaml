    shown: c_negative
    has: c_modify
    to: lin
  confront:
  - shen
  - lin
  unlock: []
- id: e_end
  when:
    shown: c_missing
    has: c_ledger
    exposed: l_zhou
    event: e_identity
    to: lin
  confront:
  - shen
  - lu
  unlock: []
kanshan:
  greeting: 潮水退了，旅馆门前那块湿漉漉的空地上要重拍一张十年前的合照。林棠把老照片摊在桌上，右边空出的一小块，被剪得干干净净。
  hints:
  - done:
      has: c_photo
    vague: 照片被剪过，先问清楚是谁裁的、为什么只留下六个人。
    direct: 先问林棠取得合照，再向沈砚舟索取旧报纸；用气象栏向周砚核对那夜的天气，取得维修单。
  - done:
      has: c_register
    vague: 登记簿的涂改不是海水泡的，锁具维修单已经说明它是人为。
    direct: 当面指出陆敏说谎，让她交出抽屉里的登记簿。
  - done:
      event: e_end
    vague: 林澜失踪与栈道、账本、封口费都连在一起，该让三个人当面对质。
    direct: 收齐底片、登记簿翻拍、账本与报案回执，把底片给林棠核对身份，再向她出示回执，让沈砚舟、陆敏对质；随后追问周砚的善后与封口费。
ending:
  questions:
  - id: q1
    text: 十年前那张合照里，被裁掉的第七个人是谁？
    options:
    - 旅馆老板沈崇
    - 临时服务员林澜
    - 前台陆敏的女儿
    - 当时还是客人的林棠
    answer: 临时服务员林澜
  - id: q2
    text: 登记簿上被涂改液抹掉的那一行，是谁动的手？
    options:
    - 沈砚舟
    - 陆敏
    - 周砚
    - 林棠
    answer: 陆敏
  - id: q3
    text: 周砚说那晚下着大雨什么也看不见，他真正隐瞒的是什么？
    options:
    - 他整夜在码头接客
    - 他参与林澜坠海后的现场处理，并收了沈崇的封口钱
    - 他在厨房帮工到天亮
    - 他喝醉睡着了
    answer: 他参与林澜坠海后的现场处理，并收了沈崇的封口钱
  - id: q4
    text: 林棠为什么执意要按老照片重拍这张合照？
    options:
    - 为了办摄影展卖照片
    - 为了找失踪十年的姐姐林澜
    - 为了低价收购旅馆
    - 为了采访老住客
    answer: 为了找失踪十年的姐姐林澜
  endings:
  - id: end_true
    title: 第七个人回来了
    text: 你把底片、登记簿、维修单和账本一一摆开，沈砚舟、陆敏、周砚在潮汐洞栈道前说出了十年前的凌晨。林棠把侧光灯对准合照右侧，那个穿服务员围裙的身影终于重新站在六个人旁边。她按下快门，十年来空着的位置第一次被填满。
    when:
      correct:
      - q1
      - q2
      - q3
      - q4
    retry: false
  - id: end_miss
    title: 潮水退去又涨
    text: 线索还没拼齐，合照右侧的空白仍在。有人说那晚只有六个人，有人坚持是海水泡坏了登记簿。你放走了能对质的人，也放走了唯一一次把第七个人叫回照片里的机会。
    when: {}
    retry: true
  truth: 十年前被从合照里裁掉、被从登记簿上抹掉的第七个人，是临时服务员林澜。她发现旅馆账目问题后，在潮汐洞栈道与老板沈崇争执，木栏断裂坠海。沈崇叫来儿子沈砚舟与杂工周砚处理现场，换取周砚母亲医药费，并让前台陆敏涂改登记簿。三人用沉默把她变成了“从没来过的人”。
  lessons:
  - 沉默和涂改不能让人真正消失，证据会替失踪者说话。
  - 以金钱换取沉默只会让事态更沉重，最终仍要面对。
  - 照片里被剪掉的空白，提醒我们看见被隐去的人。
checked: true
