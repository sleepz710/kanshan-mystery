  title: 住宿登记簿
  content: 十年前8月14日那页有七行登记，七间房全部住满；其中一行被涂改液盖住。
  holder: lu
  requires:
    exposed: l_lu
- id: c_ledger
  title: 沈崇的账本
  content: 十年前8月起分三次支出“周家医药费”的记录，末尾有沈崇的签名。末页夹着陆敏的签字说明：“我按沈崇要求涂掉林澜那行；周砚坠海后被叫来帮忙善后，三笔医药费是封口钱。”
  holder: lu
  requires:
    shown: c_register
- id: c_negative
  title: 玻璃底片
  content: 沈崇遗物中的原版玻璃底片，右侧清楚站着第七个人——穿服务员围裙的年轻女子，正对着镜头。
  holder: shen
  requires:
    exposed: l_shen
- id: c_modify
  title: 涂改层翻拍
  content: 借林棠的摄影师侧光灯斜照登记簿那一页，涂改液下的压痕显出“林澜 员工房 8/14”。
  holder: lin
  requires:
    shown: c_register
