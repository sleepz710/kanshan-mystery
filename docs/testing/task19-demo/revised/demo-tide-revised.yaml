id: demo-tide-revised
title: 潮汐第七人
source: generated
intro: 海边的潮汐旅馆要重拍一张十年前的开业合照。摄影师林棠带来了那张老照片：六个人站成一排，右侧却留着一小截被剪掉的手臂阴影。可旅馆的住客登记显示，那一晚七间房全部住满。现任老板沈砚舟说那晚他整夜在厨房，前台陆敏说旧登记簿被海水泡坏了，赶来帮忙的救援队员周砚说那夜下着大雨什么也看不见。潮水退了又涨，照片里空出来的那个位置，十年来一直空着。
facts:
- id: f_photo
  text: 十年前的开业合照原有七个人，右侧边缘被裁掉，残留一小截手臂阴影和剪刀修过的白边。
- id: f_negative
  text: 沈崇遗物中的原版玻璃底片显示，被裁掉的第七人是穿服务员围裙的年轻女子林澜。
- id: f_register
  text: 十年前8月14日的住宿登记簿有七行登记，七间房全部住满，其中一行被涂改液盖住；涂改液下的压痕是“林澜 员工房 8/14”。
- id: f_drawer
  text: 前台抽屉锁具维修单证明登记簿一直锁在抽屉内，锁芯锈死前从未进水，涂改是人为。
- id: f_rail
  text: 十年前8月15日凌晨，潮汐洞栈道断裂木栏被更换，签收人一栏写着沈砚舟的名字。
- id: f_weather
  text: 十年前8月15日报纸气象栏写明：14日夜间晴，风力三级，无降水。
- id: f_wharf
  text: 十年前8月24日码头值夜记录：一个外地女孩反复询问旅馆有没有一个叫林澜的服务员。
- id: f_missing
  text: 林棠十年前9月报案寻找失踪的姐姐林澜，报案回执上姐妹关系清楚在列。
- id: f_ledger
  text: 沈崇的账本记录十年前8月起分三次支出“周家医药费”，末尾有沈崇签名。
- id: f_core
  text: 十年前林澜发现旅馆账目问题，在潮汐洞栈道与沈崇争执，木栏断裂坠海；沈崇带沈砚舟与周砚处理现场，并让陆敏涂改登记簿，三人用沉默把她变成了从没来过的人。周砚是在坠海后被叫来处理现场的，沈崇以周砚母亲医药费的名义分三次给他封口钱。陆敏承认登记簿上的涂改由自己按沈崇要求动手完成。
characters:
- id: shen
  name: 沈砚舟
  avatar: shen.png
  profile: 潮汐旅馆现任老板，十年前是旅馆的年轻帮工。他冷静、寡言，对旅馆的旧物和旧报纸了如指掌。
  persona: 你极力保住父亲留下的旅馆和自己的名声。你习惯用“那晚我整夜在厨房准备早餐”来挡住一切追问。你清楚父亲做过什么，也清楚自己在凌晨签过什么字、在暗房里剪掉过什么。你说话慢，字斟句酌，只有被签名和底片这类实物逼到墙角时才肯松口。
  knows:
  - f_photo
  - f_negative
  - f_register
  - f_rail
  - f_weather
  - f_ledger
  - f_core
  secrets:
  - fact: f_negative
    until:
      shown: c_negative
  - fact: f_rail
    until:
      shown: c_rail
  - fact: f_core
    until:
      event: e_end
  - fact: f_register
    until:
      has: c_modify
  lies:
  - id: l_shen
    claim: 那晚我整夜在厨房准备第二天的早餐，外面的事什么都不知道。
    until:
      shown: c_rail
    admit: f_rail
  trust_start: 0
- id: lu
  name: 陆敏
  avatar: lu.png
  profile: 潮汐旅馆前台管家，任职二十年。她记性好，对登记簿和钥匙归置得一丝不苟，对旧账本绝口不提。
  persona: 你怕当年的事牵出自己，更怕失去这份工作和养老钱。你总说旧登记簿被海水泡坏了，字是自己化开的。你说话客气，爱打岔，用“锁在抽屉里”来暗示登记簿安全，却不肯解释涂改液。只有抽屉维修单摆到面前，你才会从前台抽屉取出登记簿，并最终交出沈崇的账本。
  knows:
  - f_photo
  - f_register
  - f_drawer
  - f_ledger
  - f_core
  secrets:
  - fact: f_register
    until:
      has: c_modify
  - fact: f_ledger
    until:
      shown: c_register
  - fact: f_core
    until:
      event: e_end
  lies:
  - id: l_lu
    claim: 登记簿那页是被海水泡坏的，字自己化开了。
    until:
      shown: c_drawer
    admit: f_drawer
  trust_start: 0
- id: zhou
  name: 周砚
  avatar: zhou.png
  profile: 当地海上救援队队员，十年前在潮汐旅馆打杂。他常年在海边跑，熟悉潮汐洞的每一块礁石，也熟悉那年的旧事。
  persona: 你隐瞒自己收钱封口、帮忙抬人的往事。你习惯说那晚下着大雨，什么也看不见，用天气来遮挡视线。你敬重救援队的活人，却躲着十年前那个失踪的名字。除非有人拿气象栏和维修单当面拆穿你，否则你只会含糊其辞。
  knows:
  - f_rail
  - f_weather
  - f_ledger
  - f_wharf
  - f_core
  secrets:
  - fact: f_rail
    until:
      shown: c_weather
  - fact: f_ledger
    until:
      shown: c_ledger
  - fact: f_wharf
    until:
      shown: c_weather
  - fact: f_core
    until:
      event: e_end
  lies:
  - id: l_zhou
    claim: 那晚下着大雨，我什么也看不见。
    until:
      shown: c_weather
    admit: f_weather
  trust_start: 0
- id: lin
  name: 林棠
  avatar: lin.png
  profile: 自由摄影师，包下整栋旅馆办“潮汐十年”摄影展。她带着一张老合照和一堆摄影器材，说话直接，对老照片的每个细节都盯得很紧。
  persona: 你对旧照片和缺失的身影格外上心，说话耐心、尖锐。平时谈摄影展，只有当别人拿出能够核实的旧记录时才逐步交代自己与旅馆的过去。
  knows:
  - f_photo
  - f_register
  - f_missing
  - f_wharf
  - f_core
  secrets:
  - fact: f_missing
    until:
      shown: c_wharf
  - fact: f_core
    until:
      event: e_end
  - fact: f_register
    until:
      has: c_modify
  lies: []
  trust_start: 0
clues:
