  title: 六人合照
  content: 十年前的开业合照，六个人站成一排，右侧边缘有一小截被裁掉的手臂阴影和剪刀修过的白边。
  holder: lin
  requires: {}
- id: c_weather
  title: 旧报纸气象栏
  content: 十年前8月15日报纸的气象栏：14日夜间晴，风力三级，无降水。
  holder: shen
  requires: {}
- id: c_rail
  title: 栈道护栏维修单
  content: 十年前8月15日凌晨更换潮汐洞栈道断裂木栏的单据，签收人一栏写着沈砚舟。
  holder: zhou
  requires:
    exposed: l_zhou
