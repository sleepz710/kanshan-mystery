id: demo-hotel-revised
title: 汐潮馆的第七位住客
source: generated
intro: 海边旅馆“汐潮馆”的大堂里，挂着五年前的住客合照，前台玻璃柜里锁着当年的住客登记簿，墙上贴着一张消防疏散图。五年后的夏天，老板娘林晚、维修工陈砚、自称摄影师的周叙和平台审核员苏禾又聚在这里。有人问起五年前台风夜旅馆到底住了多少人，也有人想知道那张合照为什么一直被装框挂在原处。答案藏在彼此保管的旧物和说法里。请从大堂里这三样看得见的东西开始，逐层核对。
facts:
- id: f_hall_photo
  text: 大堂墙上挂着五年前台风夜的住客合照，画面里六个人，最右侧边缘有一截被裁掉的手臂和半只系红绳的手腕，相框背板有重新装订的痕迹。
- id: f_register
  text: 五年前台风夜那页住客登记簿上，七间房全部登记为“已住”；前六行墨色发暗、笔压均匀，第七行墨色偏新，房号处有涂改，隐约能看出“储物间”三字。
- id: f_fire_map
  text: 大堂墙上的消防疏散图把“七号房”标在储物间的位置，只有一扇朝海的窗，没有独立卫浴，改造批文一栏空白。
- id: f_seven_guests
  text: 五年前台风夜，汐潮旅馆实际有七位住客，第七位没有预订，被林晚安排进由储物间改造的“七号房”。
- id: f_photo_original
  text: 周叙相机里的原始照片显示，被裁处站着一个扎马尾的女子，手腕系红绳，身后储物间的窗户亮着灯，玻璃上有一道裂痕。原片完整拍下七位住客，照片背面的当晚点名清单逐人注明姓名和房间，其中第七位为周宁；六笔平台订单的入住人也各只有一人。
- id: f_zhouning_identity
  text: 被裁掉的女子是周宁，周叙是她的弟弟，周叙化名住进旅馆查访姐姐失踪的真相。
- id: f_guestbook
  text: 五年前那本旅客留言簿中一页被撕走后又夹回，页上写着：“半夜两点，有人一直在敲储物间的门，喊一个名字，没人应。”
- id: f_orders
  text: 五年前台风夜当天，该旅馆在平台上只有六笔有效订单，第七间房没有任何预订记录，却显示“已入住”。六笔订单各登记一位入住人。
- id: f_email
  text: 五年前发给平台的举报邮件写道“汐潮旅馆台风夜有人被留在储物间，如果我不在了，请找我弟弟”，落款只有一个“周”字。
- id: f_missing
  text: 一张保存五年的寻人启事，照片上的女子扎马尾、手腕系红绳，失踪时间正是台风夜次日，联系人是“弟弟周叙”。
- id: f_duty_log
  text: 旅馆五年前台风夜的应急值班表上有陈砚的签字，时间为凌晨一点四十，备注“七号房窗户加固”；“七号房”三字后来被划掉改成“储物间”，末尾一行写着“03:10
    东侧礁石边拾到一只女式凉鞋，未上报”。
- id: f_window
  text: 陈砚工具箱里断掉的窗扣和一张维修工单，工单时间与值班记录吻合，背面用铅笔写着“窗扣断，风太大，明早换”，字迹被海水洇过。窗扣是台风折断的，维修工单没有记载陈砚人为弄断窗扣。
- id: f_chen_at_hotel
  text: 台风夜陈砚其实在旅馆修储物间的窗户，是最后一个见到周宁的人，他并未一直在码头值班。
- id: f_zhouning_lost
  text: 台风夜陈砚离开后，周宁为关被风掀开的窗被浪卷入海中；凌晨三点十分，东侧礁石边拾到一只女式凉鞋，未上报。
- id: f_lin_coverup
  text: 林晚发现周宁不见后，与陈砚商量处理掉她的行李，对外称她“清晨已离店”；林晚裁掉合照右缘、涂改登记簿房号，陈砚把留言簿那页和断窗扣、维修工单收进工具房。
- id: f_zhouning_case
  text: 周宁五年前在汐潮旅馆的台风夜落海失踪，旅馆伪造了她清晨离店的记录，并非清晨自行离开，也非从未到过旅馆或欠房费逃走。
- id: f_su_grief
  text: 五年前苏禾收到举报邮件却没有上报，一直保存着邮件，心怀愧疚。
- id: f_chen_typhoon_motive
  text: 陈砚怕被当成最后见到周宁的人，也怕无证维修和违规改造牵连自己，所以谎称一直在码头值班。
- id: f_lin_motive
  text: 林晚想保住父亲留下的旅馆，不让违规改造和无证留宿曝光，所以隐瞒周宁留宿与落海的事。
- id: f_zhou_xu_motive
  text: 周叙以自由摄影师身份作掩护，实际是要查清姐姐周宁五年前失踪的真相。
