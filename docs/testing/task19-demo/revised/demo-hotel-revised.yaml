kanshan:
  greeting: 我是看山，专替人看那些没人愿意再看第二眼的东西。大堂里那三样旧物，你打算先翻哪一样？
  hints:
  - done: {}
    vague: 墙上的合照、前台的登记簿、门边的疏散图，先凑齐这三样，别急着问人。
    direct: 先把挂在墙上的裁剪合照、前台玻璃柜里的登记簿和门边的消防疏散图都看过一遍，再决定找谁问话。
  - done:
      has: c_photo
    vague: 老板娘的登记簿能补出人数，摄影师的相机能补出被裁掉的人，两边一对就漏风。
    direct: 把登记簿第七行的涂改指给周叙看，再用被裁处的手腕换他的相机原片，他会交出存储卡。
  - done:
      has: c_orders
    vague: 陈砚听见你提到破窗就会心慌；林晚听见订单数目被点破，才肯把值班的事摆上桌。
    direct: 先拿相机原片向陈砚问修窗的事，他会取出旧留言簿；把登记簿的补写给苏禾看，换平台六笔订单，再拿这两样逼林晚交出应急值班记录。
  - done:
      event: e_window
    vague: 签了字的人说没回旅馆，那最后一环就在他的工具箱里。
    direct: 取得值班表后向陈砚出示，拿到断窗扣与工单；再问林晚和陈砚周宁失踪后怎样处理行李、怎样伪造离店记录。
ending:
  questions:
  - id: q1
    text: 五年前台风夜，汐潮旅馆里实际住着几位客人？
    options:
    - 六位
    - 七位
    - 八位
    - 无法确定
    answer: 七位
  - id: q2
    text: 合照里被裁掉的那个人是谁？
    options:
    - 一位没有登记的旅客
    - 旅馆的前任员工
    - 周叙的姐姐周宁
    - 当晚拍照的摄影师
    answer: 周叙的姐姐周宁
  - id: q3
    text: 陈砚在台风夜的真实行踪是什么？
    options:
    - 在码头值夜班
    - 在旅馆修理储物间的窗户
    - 在家休息
    - 在派出所做笔录
    answer: 在旅馆修理储物间的窗户
  - id: q4
    text: 旅馆真正隐瞒的核心事实是什么？
    options:
    - 周宁清晨自行离开
    - 周宁从未到过旅馆
    - 周宁在台风夜落海失踪，旅馆伪造了她离店的记录
    - 周宁欠下房费连夜逃走
    answer: 周宁在台风夜落海失踪，旅馆伪造了她离店的记录
  endings:
  - id: e_light
    title: 第七只凉鞋
    text: 合影、登记簿、订单与值班表终于对上了：台风夜旅馆私留了没有预订的周宁，窗被风浪打坏，陈砚签字修窗后离开，周宁为关窗落海。林晚裁掉合照、涂改房号，陈砚收起旧物，周叙找回姐姐的名字，苏禾补上当年没发出的那封举报。海风还在吹，旅馆的灯一盏一盏亮起来。
    when:
      correct:
      - q1
      - q2
      - q3
      - q4
    retry: false
  - id: e_fog
    title: 留在风里的半句
    text: 旧物还散在各人手里，各人的说法互相绞着，不能互相印证。五年前那一夜还在雾里，周宁的名字和那只凉鞋都没能被摆到众人面前，你听到的仍只是每个人想让你听见的那半句。
