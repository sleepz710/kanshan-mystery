kanshan:
  greeting: 雨还没停，末班车已经回场。司机说交了一把伞和一张旧票，管理员说失物箱一直锁着，护士说丢了药盒，常客说整路睡着。先别急着相信任何一句话——从干伞和旧票对不上的地方问起。
  hints:
  - done:
      has: c_ganshan
    vague: 伞是干的，可雨现在还没停，这把伞真的上过车吗？
    direct: 既然伞面完全干燥而当晚暴雨，失物箱里的干伞就是有人提前放进去的。
  - done:
      has: c_linphoto
    vague: 护士的照片里有人举着手机，方向好像对着驾驶室。
    direct: 林蔓手机照片拍下周启明偷拍，他所谓整路睡着是谎话，可以拿照片去问他。
  - done:
      exposed: l_p4
    vague: 周启明改口后，他手机里的东西可能比他说的重要。
    direct: 拆穿周启明后，他交出的视频能拍到梁放伞藏药盒、苏芮开箱。
  - done:
      has: c_zhouvideo
    vague: 视频里梁志远从后排拿过东西，他的聊天和转账也该看了。
    direct: 用视频分别问梁志远和苏芮，可取得梁苏聊天记录和苏芮转账记录，合谋就完整了。
ending:
  questions:
  - id: q1
    text: 失物箱里的伞完全干燥，而当晚暴雨，这说明什么？
    options:
    - 失物箱被人提前布置
    - 女乘客上车前雨停了
    - 伞是司机自己的
    - 林蔓把干伞留在车上
    answer: 失物箱被人提前布置
  - id: q2
    text: 旧票最可能来自谁？
    options:
    - 林蔓误投的母亲旧票
    - 苏芮伪造的空白票
    - 梁志远收藏的旧票
    - 周启明遗落的旧票
    answer: 林蔓误投的母亲旧票
  - id: q3
    text: 谁把药盒藏进驾驶室工具包？
    options:
    - 梁志远
    - 林蔓
    - 周启明
    - 苏芮
    answer: 梁志远
  - id: q4
    text: 证明梁志远与苏芮合谋的最强证据组合是？
    options:
    - 周启明手机视频、梁苏聊天记录和苏芮转账记录
    - 旧票和干伞
    - 林蔓的湿伞和药房小票
    - 座位压痕和停用旧票
    answer: 周启明手机视频、梁苏聊天记录和苏芮转账记录
  endings:
  - id: e_true
    title: 完整真相
    text: 干伞是苏芮提前交给梁志远放进失物箱的道具，旧票则来自林蔓误投的母亲旧月票。梁志远把林蔓落在后排座位下的试验药盒藏进驾驶室工具包，苏芮用假失物登记和转账定金配合掩护。周启明拍到全过程却删除片段，想借举报勒索。证据链闭合，四人各自隐瞒的真相都被摊开。
    when:
      correct:
      - q1
      - q2
      - q3
      - q4
    retry: false
  - id: e_part
    title: 仍有疑点
    text: 你已指出部分矛盾，但干伞如何进入失物箱、旧票来自谁、药盒被谁取走之间还缺关键证据。先别下结论，继续核对人证和物证。
    when: {}
    retry: true
  truth: 梁志远与苏芮合谋用干伞和停用旧票伪造女乘客遗落物，以掩盖梁私藏林蔓落在车上的试验药盒；周启明偷拍后谎称睡着，想借视频勒索。
  lessons:
  - 雨夜干伞与旧票对不上，是失物被提前布置的信号。
  - 旧票来自林蔓母亲的月票，不能单凭票面归属就认定遗落者。
  - 药盒压痕和工具包里的药盒比口供更能锁定藏匿者。
  - 周启明“睡着”与偷拍视频冲突，谎言一旦推翻，证据链才完整。
checked: false
