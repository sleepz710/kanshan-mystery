title: 末班车的干伞
source: generated
intro: 雨夜末班公交驶回终点站，司机交出一张早已停用的旧车票，失物招领箱里又登记了一把完全干燥的伞。夜班护士林蔓说丢了药盒，常客周启明说整路睡着，管理员苏芮坚称失物箱没人动过。旧票、干伞和药盒之间，藏着末班车到站前一段被刻意打乱的时间线。
facts:
- id: f_yu
  text: 当晚暴雨从傍晚持续到末班车到站后，任何乘客带上车的伞都会是湿的。
- id: f_jiupiao
  text: 失物箱中登记的旧车票票面日期为三年前，票种早已停用，背面有圆珠笔写的“林”字痕，与林蔓母亲旧月票夹里的缺页副券同日期、同笔迹。
- id: f_liangsu
  text: 梁志远与苏芮合谋：苏芮提前准备干伞交给梁放入失物箱，二人用停用的旧票和干伞登记假失物，以掩饰梁志远私藏林蔓落在车上的试验药盒。
- id: f_surui_money
  text: 苏芮在22:35向梁志远转账一笔“定金”，备注“伞”，约定事后分钱。
- id: f_liang_chat
  text: 22:28苏芮发消息给梁志远：“干伞放箱，票台旧票我处理，药盒明天出”；梁回复“好”。
- id: f_liangyao
  text: 梁志远从后排座位下取出林蔓落下的试验药盒，藏进驾驶室工具包，打算私卖还赌债。
- id: f_linyao
  text: 林蔓携带的药盒是医院临床试验药，无正式处方，她因怕追责不敢明说药源与旧票来源。
- id: f_zhou_tou
  text: 周启明22:54至23:10在车厢内偷拍，拍到梁志远放伞藏药盒、苏芮开箱，但删除部分片段，准备用来勒索，谎称自己整路睡着。
- id: f_zhou_report
  text: 周启明23:35匿名向公交公司安保举报失物造假，想借查处逼梁苏给钱。
- id: f_yuhen
  text: 后排座位下的灰尘有方形压痕和一滴滴药液，尺寸与林蔓药盒吻合，证明药盒曾落在后排座位下。
- id: f_douban
  text: 梁志远与苏芮的手机中留有旧票照片与失物登记讨论记录，二人曾计划用旧票补成“伞内夹票”。
