    title: 完整真相
    text: 周明00:31在B1旧冷柜发现赵淑芬遗体，00:56录音里喊出'林医生'；00:52:36林知远刷开B1楼梯门，用旧手术室门口的灭火器底座击打周明后脑致死，取走手机藏进三层医生值班室药品柜。三年前林知远在赵淑芬死亡证明上签'心源性猝死'，伙同陈国栋把遗体藏进B1旧冷柜并长期维持供电；苏雯私取钥匙下B1拍照，是为查外婆死因，但她不是凶手。林知远承担故意杀人、伪造证明文件与非法处置尸体的责任；陈国栋承担帮助毁灭证据、包庇与收受两万元的责任；苏雯私取他人物品、隐瞒下B1的事实，但不是凶手。
