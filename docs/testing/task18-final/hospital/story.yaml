    when: {}
    retry: true
  truth: 三年前林知远在赵淑芬的死亡证明上签下'心源性猝死'，伙同陈国栋把遗体藏进B1旧冷柜并长期维持供电；案发夜苏雯为查外婆死因私取林知远的钥匙下到B1拍照，随后周明独自下去发现遗体欲报警，被林知远用旧手术室门口的灭火器底座击打后脑致死并取走手机。结局方向：林知远承担故意杀人、伪造证明文件与非法处置尸体的责任；陈国栋承担帮助毁灭证据、包庇与收受两万元的责任；苏雯私取他人物品、隐瞒下B1的事实，但不是凶手。
  lessons:
  - 证据链要把时间、地点、人物和行为连起来，单凭一句证词定不了罪。
  - 对专业身份和程序性说法保持追问，签名和记录往往比口头解释可靠。
  - 私自查案不能替代报警和合法取证，动机正当也不等于手段无误。
