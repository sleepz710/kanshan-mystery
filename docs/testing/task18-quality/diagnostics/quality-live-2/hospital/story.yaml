  holder: su
  requires:
    shown: c_monitor
    has: c_corpse
events: []
kanshan:
  greeting: 三个人都咬定自己没上过三楼。监控主机坏了，可走廊里总该留下点什么。
  hints:
  - done:
      has: c_card_log
    vague: 门禁记录里有人开过旧档案室和旧手术室的门。
    direct: 找林昭要开门日志，卡号N-07的开门时间与她嘴里的说辞对不上。
  - done:
      has: c_monitor
    vague: 监控主机虽报修，未必没人私下拷过影像。
    direct: 向林昭出示【万能卡开门日志】核对22:41那条记录，她会交出走廊监控备份盘。
  - done:
      has: c_hammer
    vague: 旧手术室器械台上空了一个位置。
    direct: 先拆穿陈默“没上过三楼”的谎话，他会交出器械回收箱钥匙并指出编号J-3骨锤。
  - done:
      has: c_confession
    vague: 能解释死亡时间与三处砸伤的人，只剩那一个。
    direct: 取得骨锤与尸温记录后，向苏芮出示走廊监控备份盘，要她说清22:15至22:35的行踪。
ending:
  questions:
  - id: q1
    text: 22:15至22:35之间，在三楼旧手术室对周维安实施致命击打的是谁？
    options:
    - 林昭
    - 陈默
    - 苏芮
    - 周维安自己撞到器械台
    answer: 苏芮
  - id: q2
    text: 周维安死后，是谁把遗体转移到负一楼太平间3号柜？
    options:
    - 林昭
    - 陈默
    - 苏芮
    - 遗体由护工按正常流程送下去，无人私自转移
    answer: 陈默
  - id: q3
    text: 三年前林小雨死亡的真相是什么，与本案有何关系？
    options:
    - 林小雨死于术后感染，与本案无关
    - 周维安指使加快氯化钾泵入致林小雨死亡，苏芮代签并共同篡改存档，周维安以此胁迫苏芮
    - 林昭为索赔伪造了病历
    - 陈默私运标本导致林小雨死亡
    answer: 周维安指使加快氯化钾泵入致林小雨死亡，苏芮代签并共同篡改存档，周维安以此胁迫苏芮
  endings:
  - id: e_truth
    title: 骨锤上的三项指向
    text: 骨锤接缝处的血迹、尸温记录与走廊监控三者合上，苏芮承认22:20在旧手术室用编号J-3骨锤三次击打周维安后脑，致其死亡。三年前林小雨的死因也因此翻开：周维安指使加快氯化钾泵入，苏芮代签并参与刮改存档，如今又以此胁迫她签销毁单顶罪。苏芮故意杀人成立，篡改病历曝光；陈默私运标本与私自移尸各担其责；林昭私自取得病历副本、未报警，亦须说明。
    when:
      correct:
      - q1
      - q2
      - q3
    retry: false
  - id: e_wrong
    title: 开门卡指向的复仇者
    text: 22:41那张开门卡记录被摆在最上面，复仇动机又最明显的林昭成了被认定的人。苏芮在问询中脱了身，旧手术室的骨锤被当作器械遗落处理，负一楼的“转运”也被看作按班巡查的寻常动作。可骨锤上有别的痕迹，三年前的旧档案始终没有打开过，这桩案子还缺一块最关键的证据。
    when:
      chose:
        q1: 林昭
    retry: true
  - id: e_open
    title: 证据仍未合上
    text: 三号柜登记簿、开门日志与几份口供彼此对撑着，能回答致命击打者、移尸者与三年前旧案的那几块证据还差着。现在下结论，只会在三个人的说辞里任选一个。
    when: {}
    retry: true
  truth: 苏芮于22:20在三楼旧手术室用编号J-3的不锈钢骨锤击打周维安后脑三次致死，因为周维安三年前指使加快氯化钾泵入致死林小雨、由苏芮代签并共同篡改存档，当晚又以旧事胁迫她签销毁单顶罪；23:31陈默为掩盖私运标本上楼撞见尸体，23:41将其移入负一楼太平间3号柜；22:41林昭持卡进入时人已死，未报警。若以骨锤血迹、尸温记录、走廊监控与苏芮供述指认击打者并说明移尸者，苏芮故意杀人成立、三年前篡改病历曝光，陈默与林昭各担其责。
  lessons:
  - 口供与门禁、监控等物证对不上时，先核对动作时间与地点。
  - 亲手转移遗体的人不一定是致死者，移尸与致死要分开认定。
  - 新案动机再强的嫌疑人，也要用凶器痕迹与死亡时间交叉印证。
  - 陈年旧案的篡改记录会解释今晚的胁迫与新案动机，不能只盯眼前一具尸体。
checked: false
