title: 三号柜里的院长
source: generated
intro: 仁济安宁医院B栋下周一拆除。00:20，值班人员在负一楼太平间3号柜找到院长周维安的遗体——后脑三处伤口，衣服背面有拖擦痕。三楼旧手术室门锁完好，屋里没有翻倒打斗的痕迹，只有器械台上空出了一个位置。当晚留在B栋的只有三个人：夜班护士林昭、太平间管理员陈默、值班医生苏芮。三个人的说法互相对不上，而走廊监控主机三天前就报了修——有没有人偷偷留下过备份，还没人知道。
facts:
- id: f_lin_identity
  text: 林昭本名林昭，是死者林小雨的亲姐姐；三年前那场“术后感染”后她辞职换证，冒用他人执业材料重新入职B栋，只为接近三楼旧档案室。
- id: f_lin_alibi_claim
  text: 林昭称今晚22点以后一直守在护士站，一步没离开过。
- id: f_lin_card_log
  text: 门禁系统显示护士卡N-07（登记人林昭）20:15开启三楼旧档案室门，22:41开启三楼旧手术室门，23:02开启三楼后楼梯门。
- id: f_lin_seen_body
  text: 林昭22:41持万能卡开启旧手术室门，见周维安已倒地无脉搏，未报警，取走20:15翻出的病历副本，23:12经三楼电梯口离开。
- id: f_lin_took_coat
  text: 林昭23:55在洗衣房待洗筐中单独收走苏芮袖口带暗褐斑的白大褂。
- id: f_lin_motive
  text: 林昭入院的目的是为三年前死于用药过量的妹妹林小雨取回被篡改的病历，让周维安付出代价。
- id: f_chen_identity
  text: 陈默是B栋太平间管理员兼夜班巡查，持有负一楼与货梯钥匙。
- id: f_chen_alibi_claim
  text: 陈默称整晚都在负一楼太平间，没上过三楼。
- id: f_chen_secret
  text: 陈默长期把太平间无人认领的标本装箱，借巡查推车运出医院转卖；23:31他上三楼本是要搬走周维安私藏的一箱无编号标本，却撞见尸体。
- id: f_chen_moved_body
  text: 陈默23:31推空车进入三楼旧手术室发现尸体，23:36推同一辆车转向货梯，23:41抵达负一楼货梯口。
- id: f_chen_registry
  text: 陈默23:52在太平间登记簿签名登记“无名男性遗体，3号柜”，备注“由护工发现于三楼旧手术室”。
- id: f_su_identity
  text: 苏芮是B栋值班医生，三年前林小雨那台手术的助理。
- id: f_su_alibi_claim
  text: 苏芮称22:05以后一直在二楼值班室写病历，没上过三楼。
- id: f_su_secret
  text: 三年前周维安指使加快氯化钾泵入致林小雨死亡，苏芮在护理记录上代签并参与刮改存档。
- id: f_su_threat
  text: 21:20周维安发现档案被翻动，用手机发消息胁迫苏芮：销毁单由她签、出事她担；苏芮回“最后一次”。
- id: f_su_killed
  text: 苏芮22:20在旧手术室与周维安争执，从器械台取编号J-3不锈钢骨锤击打其后脑三次，22:31原路离开，左袖留下污渍。
- id: f_su_print
  text: 苏芮22:04用本人医生账号在系统打印“三楼旧手术室器械报废销毁单”，22:05持该纸进入三楼旧手术室走廊。
