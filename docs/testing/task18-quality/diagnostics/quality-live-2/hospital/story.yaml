clues:
- id: c_registry
  title: 太平间登记簿
  content: B栋负一楼太平间登记簿末页，23:52一栏写着“无名男性遗体，3号柜”，备注“由护工发现于三楼旧手术室”，登记人签名“陈默”。
  holder: chen
  requires: {}
- id: c_card_log
  title: 万能卡开门日志
  content: 门禁系统导出的开门记录：护士卡N-07（登记人林昭）20:15开启三楼旧档案室门，22:41开启三楼旧手术室门，23:02开启三楼后楼梯门。
  holder: lin
  requires: {}
- id: c_monitor
  title: 走廊监控备份盘
  content: 林昭从护士站监控主机私下拷出的U盘。三楼走廊摄像头22:05拍到苏芮手持一张打印纸走向旧手术室、22:31原路离开且左袖有深色污渍；三楼电梯口23:12拍到林昭快步离开；三楼走廊23:31拍到陈默推空车进入旧手术室、23:36推同一辆车转向货梯；负一楼货梯口23:41拍到同一推车。
