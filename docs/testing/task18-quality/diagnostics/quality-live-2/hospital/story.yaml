  holder: lin
  requires:
    exposed: l_lin_alibi
- id: c_record
  title: 妹妹的旧病历与篡改对照
  content: 患者林小雨（22岁）三年前术后死亡记录：院内存档写“术后感染”，家属留存联写“氯化钾微量泵入过快”；两份记录的护理签名栏均有“苏芮”代签，医嘱栏有周维安印章；存档页数值有刮改痕迹。
  holder: lin
