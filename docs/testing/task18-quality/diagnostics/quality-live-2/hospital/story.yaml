    shown: c_record
    has: c_destroy
    exposed: l_su_alibi
- id: c_corpse
  title: 陈默的尸温与尸僵记录
  content: 陈默23:50在太平间按惯例填写的遗体初检记录：遗体尚有余温、尸僵限于下颌，估算死亡时间在22:15至22:35之间；后脑三处挫裂伤，衣物背部有拖擦痕。
  holder: chen
  requires:
