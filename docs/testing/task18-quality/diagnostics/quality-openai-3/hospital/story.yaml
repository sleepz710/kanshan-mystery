    text: 你已经摸到异常的轮廓，但还没把“谁在取材室动手”“停尸间里是谁在拍门”“许闻究竟想掩盖什么”三件事同时钉死。继续补齐门禁、对讲、监护、登记更改与取材室监控之间的对应关系，才能让凶手无从抵赖。
    when: {}
    retry: true
  truth: 真相是病理住院医许闻在2026-10-17 01:11确认17床王建民仍有心电波形后，因害怕自己00:48私自加用丙泊酚暴露，先把王建民按死亡患者送入地下二层停尸间，并在01:42于病理取材室内用绿色氧气瓶击打发现拍门求救的护工赵成灭口；林芷只在01:46下楼拿走腕带，何敬则在01:34得知异常后延迟上报，查清这些证据即可将许闻锁定为凶手并揭开“停尸间拍门声”的来源。
