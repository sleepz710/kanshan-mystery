    title: 拍门声的源头
    text: 你还原了关键链条：01:34赵成报告停尸间里有人拍门，且拍门者戴着17床王建民的腕带；这说明王建民当时并未作为真正的死者安置，而是被活着送进了地下二层。01:42病理取材室监控拍下许闻提起绿色氧气瓶击打赵成。再结合17床心电监护截图与死亡登记更改单，可以确定王建民在01:11仍有心电波形，许闻却已在01:12把他按死亡患者接收入停尸间A，并在01:44撤销登记。许闻为掩盖自己00:48私自加用丙泊酚及错误送入停尸间的违规行为，在赵成发现异常后杀人灭口；林芷01:46下楼拿走腕带，何敬则在01:34得知异常后延迟上报。所谓“停尸间拍门声”，正是仍然活着的王建民在求救。
