- id: f13
  text: 6月16日23:22，罗恪亲自把昏睡的邱闻从监护区推到7号楼B1旧病理走廊。
- id: f14
  text: 6月16日22:54，顾闻签字借出一把氧气瓶扳手。
- id: f15
  text: 6月16日22:54，顾闻前往B1旧病理层拆停用氧气阀和铜件。
- id: f16
  text: 6月16日23:26，顾闻用氧气瓶扳手击打邱闻后脑。
- id: f17
  text: 6月16日23:26，顾闻击打邱闻后脑的动机是害怕邱闻认出自己在旧病理层偷拆停用氧气阀和铜件卖废铜。
- id: f18
