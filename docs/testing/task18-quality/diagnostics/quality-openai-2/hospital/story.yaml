title: 冷库尸行
source: generated
intro: 暴雨封楼的夜里，停用多年的7号楼B1旧病理层又传出“冷库里有东西在走”的传闻。凌晨，留观病人邱闻死在3号冷库附近，值夜人员只找到一张像尸体直立的监控定格。夜班护士孟杉、实习医生罗恪、设备维修员顾闻都说自己只是听见动静后才过去查看。你要在这间潮湿、断续闪灯的旧病理层里查清：那道“尸影”是谁弄出来的，邱闻又是怎么死的。
