  endings:
  - id: e1
    title: 连续掩盖下的冷库尸行
    text: 你还原了这场“冷库尸行”的全过程。22:48，罗恪无医嘱多取并给邱闻注射了一支咪达唑仑；23:22，他又把昏睡的邱闻私自推到7号楼B1旧病理走廊，想避开监护记录。23:26，正在B1偷拆停用氧气阀和铜件的顾闻被苏醒的邱闻抓住，为灭口用借来的氧气瓶扳手击打邱闻后脑，造成致命伤。23:31，孟杉回到B1发现人已倒地不动，怕自己先前私用束缚带和进入旧病理层的事暴露，便把邱闻抬上布草车推进3号冷库。23:32，白布、输液架和布草车在监控里叠成了像“尸体直立行走”的影像，于是怪谈代替了真相。所谓闹鬼，其实是三个人一环扣一环的违规、杀人和掩盖。
    when:
      correct:
      - q1
      - q2
      - q3
    retry: false
  - id: e2
    title: 证据仍有缺口
    text: 你已经看出“尸影”不像灵异现象，但现有证据还不足以完整锁定三人在23:22、23:26、23:31各自实施的关键动作。继续核对B1走廊画面、推床去向、工具借用和三份补充口供，才能把转移、击打和藏尸这三步彻底接上。
    when: {}
    retry: true
  truth: 所谓“冷库尸行”并非灵异，而是罗恪为掩盖22:48无医嘱加量镇静在23:22把邱闻转到7号楼B1旧病理走廊，顾闻因害怕自己偷拆停用氧气阀卖废铜在23:26用氧气瓶扳手击打邱闻后脑致死，孟杉又在23:31把人推进3号冷库制造“尸影”伪象，结局将同时查实顾闻的杀人行为与三人的连续掩盖。
  lessons:
  - 怪谈往往是人为痕迹被连续掩盖后的错看，不是对证据调查的替代。
  - 医疗场景中的每一次违规操作都可能把可挽回的错误推向无法收拾的后果。
  - 刷卡、监控、借用登记和补充口供能把多人串联掩盖的时间链重新拼回真相。
checked: true
