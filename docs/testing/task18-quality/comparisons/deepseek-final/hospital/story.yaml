title: 负一层治疗室
source: generated
intro: 安宁疗护医院坐落在城郊，专收治晚期病人，走廊里永远飘着消毒水和旧地毯的味道。9月14日清晨6:10，68岁的周海在负一层“治疗室”被宣布死亡——家属赶到时，只看到遗体左手腕上两处新鲜的针眼。前一晚留在院里的只有三个人：三楼夜班护士陈默、护士长苏婉、院长林致远。院方的说法是“临终抢救的正常处置”。可地下室的门在凌晨1:47被刷开过，药柜的账上多出一笔领药，遗体记录却写着“抢救无效”。三个人都说自己没做错什么，也都没有完整的不在场证明。天亮之前，你要弄清那扇门后面到底发生了什么。
facts:
- id: f_chen_card
  text: 9月14日1:38陈默在负一层电梯口把门禁卡N-07递给苏婉，并早知道药柜登记本上的“陈默”不是自己签的，因怕丢工作一直隐瞒。
- id: f_su_inject
  text: 苏婉是临时医嘱的执行人，1:32以陈默名义领药，1:47刷卡进入治疗室，约1:50给周海注射；她还保管着伪造的器官捐献同意书。
- id: f_lin_mastermind
  text: 林致远23:50开具致命剂量医嘱，在药柜登记本上冒写“陈默”姓名，伪造器官捐献同意书，2:41亲自摘取组织，3:05运出。
- id: f_lin_admit_sign
  text: 林致远承认药柜登记本上“陈默”的签名是他自己冒签的。
- id: f_lin_harvest_admit
  text: 林致远承认2:41至2:58在治疗室摘取人体组织，3:05推出后勤通道交予华康公司人员。
- id: f_su_admit_inject
  text: 苏婉承认约1:50在治疗室按临时医嘱为周海推药。
- id: f_su_admit_forge
  text: 苏婉承认保管并使用了伪造的器官捐献同意书。
- id: f_chen_admit_borrow
  text: 陈默承认1:38把门禁卡N-07交苏婉。
