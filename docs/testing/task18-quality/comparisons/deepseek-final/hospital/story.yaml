clues:
- id: c_night_schedule
  title: 夜班排班表
  content: 安宁疗护医院9月13日20:00至9月14日8:00值班表：陈默（三楼护士站）、苏婉（21:00—23:00查房班，之后留守护士长值班室）、林致远（行政总值班，22:00巡查签到，值班至次日8:00）。三人签名字迹均清晰。
  holder: su
  requires: {}
- id: c_autopsy_record
  title: 周海遗体初检记录
  content: 9月14日6:10，周海（68岁，胰腺癌晚期）在负一层治疗室被宣布死亡；遗体左手腕内侧有两处新鲜针眼，其中一处皮下淤血；记录人陈默签名，时间6:25。
  holder: chen
  requires: {}
- id: c_access_log
  title: 负一层门禁刷卡记录
  content: 门禁系统打印件显示：9月14日1:47，卡号N-07刷开负一层治疗室门；2:58该卡再次刷卡。N-07于9月2日由陈默登记领用，领用单附后。
  holder: su
  requires: {}
- id: c_med_log
  title: 药柜领药登记本
  content: 住院部药柜登记本9月14日页载：1:32领出丙泊酚2支（批号A2411）、氯琥珀胆碱1支，领用人栏写“陈默”，字迹连笔快写、末笔上挑；同一时段无其他人领药记录。
  holder: chen
  requires:
    shown: c_autopsy_record
- id: c_elevator_screenshot
  title: 电梯轿厢监控截图
  content: 负一层电梯口摄像头截图，文件属性显示导出时间9月15日9:12：9月14日1:38，陈默从胸前取出白色门禁卡递给穿护士长制服的苏婉，两人交谈约20秒，陈默未进电梯；电梯门关闭后他按上行键离开。
  holder: lin
  requires:
    trust: 1
    shown: c_access_log
- id: c_corridor_video
  title: 负一层走廊监控视频
  content: 负一层走廊监控导出文件，属性显示导出时间9月15日9:40：9月14日1:44苏婉推药车至治疗室门口；1:47她拿白色卡片刷卡进入；2:41穿白大褂、胸牌反光可见“院长”字样的林致远进入；2:55苏婉推空药车离开；2:58林致远离开；3:05林致远推一辆冷藏箱推车经后勤通道离开画面。
  holder: lin
  requires:
    shown: c_elevator_screenshot
    has: c_med_log
- id: c_signature_sample
  title: 陈默签名比对样本
  content: 陈默当场重写姓名三次，并调出9月10日排班表本人签名：运笔慢、末笔顿。与药柜登记本9月14日“陈默”签名（连笔快写、末笔上挑）明显不同；该上挑特征与排班表上林致远22:00巡查签到字迹一致。
  holder: chen
  requires:
    shown: c_med_log
- id: c_medical_records
  title: 周海病历附页（同意书与临时医嘱单）
  content: 周海病历附页夹有两份文件：一份9月11日“器官捐献同意书”，家属签名“周晓芸”，笔迹与9月10日入院同意书上的“周晓芸”明显不同；探视登记显示周晓芸9月10日17:30离院、9月14日8:20才到院。另一份9月13日23:50临时医嘱单，林致远签名开具丙泊酚2支、氯琥珀胆碱1支，执行人签名“苏婉”，与排班表上苏婉签名笔锋一致。苏婉在被拆穿后承认：约1:50她在治疗室按该医嘱为周海推药。
  holder: su
  requires:
    shown: c_corridor_video
    exposed: l_su_rest
- id: c_cold_chain
  title: 冷链运输单
  content: 运输单开具时间9月14日3:20：发货地“安宁疗护医院后勤通道”，收货方“华康生物材料公司”，货物“人体组织样本2件”，经办人签名林致远，签收时间9月14日5:40。林致远交出时承认：箱内组织由他2:41至2:58在治疗室摘取，3:05推出后勤通道交予华康公司人员。
  holder: lin
  requires:
    shown: c_signature_sample
    exposed: l_lin_sign
events: []
kanshan:
  greeting: 我是导诊台工作人员，只能帮你指个方向。
  hints:
  - done:
      has: c_night_schedule
    vague: 排班表能框住当晚在院的人。
    direct: 去护士站墙上查看夜班排班表，向苏婉要一份。
  - done:
      has: c_autopsy_record
    vague: 遗体记录里藏着一处反常。
    direct: 找陈默要周海遗体初检记录，注意针眼位置。
  - done:
      has: c_access_log
    vague: 门禁系统会记下刷卡时间。
    direct: 向苏婉索取负一层门禁刷卡记录打印件。
  - done:
      has: c_med_log
    vague: 药柜本上的签名未必是本人。
    direct: 拿遗体记录给陈默看，换药柜领药登记本副本。
  - done:
      has: c_elevator_screenshot
    vague: 电梯口的画面能解开借卡疑点。
    direct: 先给林致远看门禁记录并取得信任，再要电梯截图。
  - done:
      has: c_corridor_video
    vague: 走廊监控能还原治疗室门前的人员进出。
    direct: 拿药柜登记本和电梯截图去找林致远，换走廊监控视频。
  - done:
      has: c_signature_sample
    vague: 笔迹比对能指向冒签者。
    direct: 把药柜登记本给陈默看，请他当场写名字比对。
  - done:
      has: c_medical_records
    vague: 病历附页里有同意书和医嘱单。
    direct: 用走廊监控拆穿苏婉的谎话，她才会交出病历附页。
  - done:
      has: c_cold_chain
    vague: 运输单能证明组织由谁经办运出。
    direct: 用签名比对样本拆穿林致远，他才会交出冷链运输单。
ending:
  questions:
  - id: q1
    text: 9月14日1:47，是谁刷卡打开负一层治疗室的门？
    options:
    - 陈默
    - 苏婉
    - 林致远
    - 门禁系统故障自动开启
    answer: 苏婉
  - id: q2
    text: 9月14日凌晨，是谁在治疗室给周海注射了丙泊酚与氯琥珀胆碱？
    options:
    - 陈默
    - 苏婉
    - 林致远
    - 值班医生赵某
    answer: 苏婉
  - id: q3
    text: 被运往华康生物材料公司的人体组织，是谁经办运出的？
    options:
    - 陈默
    - 苏婉
    - 林致远
    - 华康公司司机
    answer: 林致远
  endings:
  - id: e_truth
    title: 真相大白
    text: 走廊监控、冷链运输单与伪造同意书一一对上：苏婉刷卡、注射，林致远冒签医嘱、摘取组织并运出，陈默被胁迫借卡。三人被带走，案件告破。
    when:
      correct:
      - q1
      - q2
      - q3
    retry: false
  - id: e_insufficient
    title: 证据不足
    text: 你出示的证据仍不足以锁定刷卡者和主谋，林致远以“执行医嘱、毫不知情”脱身，负一层治疗室次日重新上锁。
    when: {}
    retry: true
  truth: 核心真相：院长林致远为向华康生物材料公司输送人体组织，指使护士长苏婉于9月14日凌晨在负一层治疗室给病人周海注射过量丙泊酚与氯琥珀胆碱致死，并以陈默名义登记领药、伪造器官捐献同意书，随后亲自摘取组织经后勤通道运出；陈默仅被以女儿手术费要挟借出门禁卡。结局方向：若玩家出示冷链运输单、伪造同意书与走廊监控，分别指认林致远为主谋、苏婉为注射执行者、陈默为被胁迫协助者，则案件告破，林、苏被带走，陈默因协助行为另案处理；若仅凭药柜签名与领药记录指认陈默，或只指认苏婉而不出示运输单，林致远便以“执行医嘱、毫不知情”脱身，负一层治疗室次日重新上锁。
  lessons:
  - 签到表和监控比口头保证更可靠。
  - 签名笔迹能揭示冒名顶替者。
  - 运输单据是追踪组织流向的关键。
checked: false
