    text: 你还原了整条调包链：17:54到货的唯一真书S2298先被放入B-3，18:31仍在柜中；18:42林沅把0719员工卡私借给赵澄；18:48赵澄刷卡打开B-3，取走陈添预订的《街字解剖》，塞入自己16:05领出的陈列空白样书D-14；19:01至19:03他在聊天里承认已把预订柜那本拿出，并收下唐芮的200元；21:12唐芮又把条码S2298的真书寄存在校内快递柜7号，收件人为赵澄。凭寄存截图，你们当晚就能追回真书；凭聊天记录、开锁日志和门卡交接视频，也足以追责赵澄与违规借卡的林沅。
