story:
  id: generated-83bec48eaab84b94bd560265c0d63eab
  title: 旧楼M-17
  source: generated
  intro: 暴雨夜的霁川医院封存旧楼又传出“冷库里的尸体自己走出来了”的传闻。凌晨1:32，1号旧手术室门口，值班员罗衡后脑重伤昏迷，冷库17号柜空了，地上只剩通向废物电梯的轮印和一只砸瘪的氧气瓶。夜班护士苏芮、太平间护工程坤、副院长秦岳都说自己没碰那具编号M-17的遗体。天亮前，你得查清旧楼里到底是谁在搬尸、谁在伤人，又是谁故意把医院闹成“闹鬼”。
  facts:
  - id: f1
    text: 苏芮是霁川医院夜班护士。
  - id: f2
    text: 程坤是霁川医院太平间护工。
  - id: f3
    text: 秦岳是霁川医院副院长兼外科主任。
  - id: f4
    text: 2026年7月14日01:16，苏芮进入过旧楼连廊。
  - id: f5
    text: 2026年7月14日01:18，程坤去过冷库，并把M-17从17号柜推了出来。
  - id: f6
    text: 2026年7月14日01:24，秦岳进过1号旧手术室。
  - id: f7
    text: 2026年7月14日01:22，程坤把标有M-17的推床送进了1号旧手术室。
  - id: f8
    text: 2026年7月14日01:25，秦岳在1号旧手术室门口用氧气瓶击倒了罗衡。
  - id: f9
    text: 2026年7月14日01:24至01:25间，秦岳下令程坤把17号遗体送往焚化间。
  - id: f10
    text: 2026年7月14日01:29，程坤按秦岳指示用废物电梯把M-17送往焚化间通道，并想做成旧楼闹鬼。
  - id: f11
    text: 苏芮早就怀疑M-17就是自己失踪的姐姐顾南，2026年7月14日凌晨潜入旧楼是去找M-17所穿病号服夹层里的录音笔。
  - id: f12
    text: 苏芮于2026年7月14日01:27从M-17所穿病号服夹层取出银色录音笔并带离旧楼。
  - id: f13
    text: 顾南生前住在旧楼17床，并在2023年9月17日22:41留下录音，指称秦岳在她未签字情况下给她加快镇静滴速。
  - id: f14
    text: M-17原登记就是17床患者顾南。
  - id: f15
    text: 2023年9月18日00:10，秦岳在冷库登记单上亲手把“17床 顾南”改成“无名女尸M-17”。
  - id: f16
    text: 旧楼闹鬼的轮声和关灯传言，多半是程坤这些年替秦岳搬运冷库遗体时故意制造的。
  characters:
  - id: su_rui
    name: 苏芮
    avatar: su_rui.png
    profile: 霁川医院夜班护士。暴雨夜值守期间被卷入旧楼事件，声称自己凌晨后一直在护士站。
    persona: 外冷内急，长期暗查姐姐顾南失踪一事，对医院旧楼和M-17格外敏感。
    knows:
    - f1
    - f4
    - f7
    - f8
    - f11
    - f12
    - f13
    secrets:
    - fact: f11
      until:
        exposed: l1
    - fact: f12
      until:
        exposed: l1
    - fact: f13
      until:
        has: c7
    lies:
    - id: l1
      claim: 昨晚1点后我一直在护士站，没去过旧楼。
      until:
        shown: c4
      admit: f4
    trust_start: 0
  - id: cheng_kun
    name: 程坤
    avatar: cheng_kun.png
    profile: 霁川医院太平间护工，常年负责旧楼冷库和值班杂务，自称案发整夜都在一层值班室。
    persona: 贪钱怕事，熟悉旧楼每条暗道和监控死角，习惯用“闹鬼”传言替自己遮掩。
    knows:
    - f2
    - f5
    - f7
    - f9
    - f10
    - f16
    secrets:
    - fact: f9
      until:
        has: c6
    - fact: f10
      until:
        exposed: l2
    - fact: f16
      until:
        exposed: l2
    lies:
    - id: l2
      claim: 我整夜都在一层值班室，没碰过M-17。
      until:
        shown: c5
      admit: f5
    trust_start: 0
  - id: qin_yue
    name: 秦岳
    avatar: qin_yue.png
    profile: 霁川医院副院长兼外科主任。案发后以管理者身份介入，坚称自己昨夜未进旧手术室。
    persona: 精于控制流程和话术，最在意旧楼遗体、病历与个人责任之间的关联被人串起来。
    knows:
    - f3
    - f6
    - f8
    - f9
    - f14
    - f15
    secrets:
    - fact: f8
      until:
        shown: c5
    - fact: f9
      until:
        has: c6
    - fact: f14
      until:
        has: c8
    - fact: f15
      until:
        has: c8
    lies:
    - id: l3
      claim: 我昨晚只在主楼会议室，从没进过旧手术室。
      until:
        shown: c5
      admit: f6
    trust_start: 0
  clues:
  - id: c1
    title: 停尸间值班记录
    content: 《7月14日停尸间值班记录》：2026年7月14日01:32，保洁员叶琴在旧楼1号手术室门口发现值班员罗衡后脑出血昏迷；冷库17号柜门敞开，登记遗体M-17缺失；地面可见从冷库通向旧手术室、再继续朝废物电梯方向延伸的单列推床轮印。
    holder: su_rui
    requires: {}
  - id: c2
    title: 旧楼门禁日志
    content: 《旧楼门禁日志导出》：2026年7月14日01:16，卡A-204（登记人：苏芮）刷开主楼至旧楼连廊门；01:18，卡B-017（登记人：程坤）刷开冷库门；01:24，卡C-001（登记人：秦岳）刷开1号旧手术室门；01:29，卡B-017刷开废物电梯门。
    holder: cheng_kun
    requires: {}
  - id: c3
    title: 氧气瓶检材单
    content: 《1号旧手术室检材单》：门口氧气瓶瓶身有新鲜撞击凹痕，瓶口与瓶柄处检出罗衡血迹；检材照片拍摄时间为2026年7月14日02:03。
    holder: qin_yue
    requires: {}
  - id: c4
    title: 连廊监控导出
    content: 《连廊监控导出》：监控时间2026年7月14日01:16:08，夜班护士苏芮独自进入旧楼连廊；01:27:41，她从同一方向快步返回，右手握着一支银色录音笔。
    holder: cheng_kun
    requires:
      trust: 1
  - id: c5
    title: 观察窗偷拍视频
    content: 《1号旧手术室观察窗偷拍视频》：手机录像开始于2026年7月14日01:22:11。画面中，护工程坤把标有“M-17”的黑色遗体推床推进1号旧手术室；01:24:36，秦岳进入手术室；01:25:04，罗衡冲到门口喊“秦院长你不能烧掉这具尸体”，随后秦岳抡起门旁氧气瓶击中罗衡后脑，罗衡倒地。
    holder: su_rui
    requires:
      shown: c4
  - id: c6
    title: 手术室对讲录音
    content: 《1号旧手术室对讲录音》：医院对讲系统自动存档，录音时间为2026年7月14日01:24:40至01:25:12。可清楚听到秦岳声音：“程坤，按我说的，把17号先送焚化间。”随后罗衡喊“秦院长，你这是灭证”，紧接着传来重击声与秦岳一句“把灯都关了。”
    holder: cheng_kun
    requires:
      shown: c5
  - id: c7
    title: 银色录音笔音频导出
    content: 《银色录音笔音频导出》：文件创建时间为2023年9月17日22:41，录音中女声自述“我是顾南，病历在旧楼17床。秦岳今天让我签加量同意书，我没签，他还是给我加了镇静滴速。要是我出事，请查17床和他的签字。”；苏芮在交出录音笔时签字说明“我于2026年7月14日01:27从M-17所穿病号服夹层取出此笔”；录音笔外壳内侧贴有“顾南
      17床”字条。
    holder: su_rui
    requires:
      exposed: l1
  - id: c8
    title: 冷库遗体登记更正单
    content: 《冷库遗体登记更正单》：表单日期为2023年9月18日00:10。原登记“17床 顾南 女 24岁”被红笔划掉，改写为“无名女尸 M-17”；更正人签名为秦岳。
    holder: qin_yue
    requires:
      shown: c6
      exposed: l3
  - id: c9
    title: 程坤补充供述
    content: 《程坤补充供述》：程坤签字确认，“2026年7月14日01:18我用自己的B-017卡开冷库，把17号柜里的M-17推出；01:29我又按秦岳的指示，用废物电梯把M-17送往焚化间通道，想做成旧楼闹鬼。”
    holder: cheng_kun
    requires:
      exposed: l2
  events: []
  kanshan:
    greeting: 旧楼的说法很多，但真正能定人的只有时间、地点和谁亲手碰过M-17。先把三个人的行踪拆开。
    hints:
    - done:
        has: c1
      vague: 案发现场已经说明M-17不是凭空消失的，去找能对应具体时间的出入记录。
      direct: 找程坤取得《旧楼门禁日志导出》。
    - done:
        has: c4
      vague: 有人已经被拍到进入旧楼，接着查手术室门口到底发生了什么。
      direct: 向苏芮出示《连廊监控导出》，取得《观察窗偷拍视频》。
    - done:
        has: c5
      vague: 谁动手、谁在场已经不难判断，但下令转移遗体的人还需要更直接的声音证据。
      direct: 向程坤出示《观察窗偷拍视频》，取得《手术室对讲录音》。
    - done:
        has: c6
      vague: 想说明为什么要烧掉M-17，就得把M-17和顾南连起来。
      direct: 拆穿秦岳后，向他追查《冷库遗体登记更正单》；同时拆穿苏芮后取得《银色录音笔音频导出》。
  ending:
    questions:
    - id: q1
      text: 2026年7月14日01:25，在1号旧手术室门口用氧气瓶击倒罗衡的人是谁？
      options:
      - 苏芮
      - 程坤
      - 秦岳
      answer: 秦岳
    - id: q2
      text: 2026年7月14日01:18把M-17从17号柜推出，并在01:29用废物电梯继续转移的人是谁？
      options:
      - 苏芮
      - 程坤
      - 秦岳
      answer: 程坤
    - id: q3
      text: 是谁下令在2026年7月14日凌晨把M-17送往焚化间通道，以掩盖这具遗体原本登记为顾南的事实？
      options:
      - 苏芮
      - 程坤
      - 秦岳
      answer: 秦岳
    endings:
    - id: e1
      title: 封住焚化间通道
      text: 你还原了旧楼凌晨的关键链条：01:18程坤把M-17从17号柜推出，01:22送进1号旧手术室；01:24秦岳进入现场，下令把17号遗体送往焚化间；01:25他在门口用氧气瓶击倒试图阻拦的罗衡；01:29程坤继续转移M-17。进一步结合录音笔和更正单，可确认M-17原本就是17床患者顾南，秦岳曾对顾南违规加量用药，并在2023年9月18日将其遗体改名为M-17。苏芮潜入旧楼不是行凶，而是确认姐姐身份并取回藏在病号服夹层里的录音笔。医院随即封锁焚化间通道、追缴M-17，并对秦岳与程坤立案追责。
      when:
        correct:
        - q1
        - q2
        - q3
      retry: false
    - id: e2
      title: 证据仍未闭合
      text: 你已经摸到旧楼事件的轮廓，但现有判断还不足以完整锁定谁在转移M-17、谁在下令灭证，以及M-17与顾南之间的登记关系。要继续追查，请补齐焚化间转运记录、手术室内直接影音或对讲证据，以及2023年17床病历与冷库更正材料。
      when: {}
      retry: true
    truth: 核心真相是副院长秦岳为掩盖自己曾对17床患者顾南违规加量用药、又在2023年9月18日把其遗体改名为M-17的事实，指使护工程坤于2026年7月14日凌晨把M-17转往焚化间通道，并在01:25用1号旧手术室门口的氧气瓶击倒前来阻拦的罗衡，而夜班护士苏芮潜入旧楼只是为了确认M-17就是姐姐顾南并取回顾南藏在M-17所穿病号服夹层里的录音笔；全对可据此封锁焚化间通道、追缴M-17并追究秦岳与程坤责任，证据不足则继续追查焚化间记录与2023年17床病历。
    lessons:
    - 门禁、监控、录音与书面更正单要互相印证，才能从“在场”推到“实施”。
    - 证人或嫌疑人的隐瞒不等于其实施核心犯罪，需区分个人秘密与案件主犯责任。
    - 医院内部流程一旦被权力操控，留痕材料反而会成为还原真相的关键。
  checked: null
problems:
- 角色 su_rui 的秘密事实 f8 存在无锁副本，请在本人 secrets 中落实设计的解锁条件。
